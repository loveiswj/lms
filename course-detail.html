  <script>
  /* ── YouTube 진도율 추적 + Supabase 저장 ── */
  var ytPlayer = null;
  var _progressCourseId = null;
  var _progressTimer = null;
  var _lastSavedPct = -1;

  function onYouTubeIframeAPIReady() {
    var iframe = document.getElementById('ytPlayer');
    if (!iframe) return;
    ytPlayer = new YT.Player('ytPlayer', {
      events: {
        onStateChange: onPlayerStateChange,
        onReady: onPlayerReady
      }
    });
  }

  function onPlayerReady() {
    var params = new URLSearchParams(window.location.search);
    _progressCourseId = parseInt(params.get('id'));
  }

  function onPlayerStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING) {
      if (!_progressTimer) {
        _progressTimer = setInterval(saveProgress, 10000);
      }
    } else {
      clearInterval(_progressTimer);
      _progressTimer = null;
      saveProgress();
    }
  }

  async function saveProgress() {
    if (!ytPlayer || !ytPlayer.getDuration) return;
    if (!_progressCourseId) return;

    var duration = ytPlayer.getDuration();
    var current  = ytPlayer.getCurrentTime();
    if (!duration || duration <= 0) return;

    var pct = Math.min(100, Math.round((current / duration) * 100));

    if (pct === _lastSavedPct) return;
    var { data: { session } } = await _supabase.auth.getSession();
    if (!session) return;

    _lastSavedPct = pct;

    await _supabase.from('progress').upsert({
      user_id:         session.user.id,
      course_id:       _progressCourseId,
      progress_pct:    pct,
      last_watched_at: new Date().toISOString()
    }, { onConflict: 'user_id,course_id' });

    var bar = document.getElementById('heroProgressBar');
    var txt = document.getElementById('heroProgressTxt');
    if (bar) bar.style.width = pct + '%';
    if (txt) txt.textContent = pct + '% 수강 완료';

    if (pct >= 100) {
      clearInterval(_progressTimer);
      _progressTimer = null;
      await issueCertificate(session.user.id, _progressCourseId);
    }
  }

  async function issueCertificate(userId, courseId) {
    var { data: existing } = await _supabase
      .from('certificates')
      .select('id')
      .eq('user_id', userId)
      .eq('course_id', courseId)
      .single();
    if (existing) return;

    await _supabase.from('certificates').insert({
      user_id:   userId,
      course_id: courseId,
      issued_at: new Date().toISOString()
    });

    showCertBanner();
  }

  function showCertBanner() {
    var banner = document.getElementById('certBanner');
    if (banner) {
      banner.style.display = 'flex';
      setTimeout(function() { banner.style.opacity = '1'; }, 100);
    }
  }

  function seekVideo(seconds, el) {
    var items = document.querySelectorAll('.video-timeline__item, .chap-btn, .chap-item');
    items.forEach(function(i) { i.classList.remove('is-active'); });
    if (el) el.classList.add('is-active');
    if (ytPlayer && ytPlayer.seekTo) {
      ytPlayer.seekTo(seconds, true);
      ytPlayer.playVideo();
    } else {
      var iframe = document.getElementById('ytPlayer');
      if (iframe) iframe.src = iframe.src.replace(/[?&]start=\d+/, '') +
        (iframe.src.indexOf('?') > -1 ? '&' : '?') + 'start=' + seconds + '&autoplay=1';
    }
  }

  function formatVideoTime(sec) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

    }

    /* ── 메인 진입점 ── */
    function init() {
      var params   = new URLSearchParams(window.location.search);
      var courseId = params.get("id");

      if (!courseId || typeof COURSES === "undefined") {
        document.getElementById("detailHero").innerHTML =
          '<div class="detail-hero"><div class="detail-hero__dots"></div><div class="container" style="text-align:center;padding:40px 0;">' +
          '<div class="detail-hero__eyebrow">교육 동영상</div>' +
          '<h1 class="detail-hero__title" style="max-width:100%;">과정을 찾을 수 없습니다</h1>' +
          '<p class="detail-hero__outcome"><a href="course-list.html" style="color:var(--gold);text-decoration:underline;">전체 과정 보기 →</a></p>' +
          '</div></div>';
        return;
      }

      var course = getCourseById(courseId);
      if (!course) {
        document.getElementById("detailHero").innerHTML =
          '<div class="detail-hero"><div class="detail-hero__dots"></div><div class="container" style="text-align:center;padding:40px 0;">' +
          '<div class="detail-hero__eyebrow">교육 동영상</div>' +
          '<h1 class="detail-hero__title" style="max-width:100%;">존재하지 않는 과정입니다</h1>' +
          '<p class="detail-hero__outcome"><a href="course-list.html" style="color:var(--gold);text-decoration:underline;">전체 과정 보기 →</a></p>' +
          '</div></div>';
        return;
      }

      updateBreadcrumb(course);
      renderHero(course);
      renderMain(course);
      renderPurchaseCard(course);
      renderRelated(course);

      var pn = document.getElementById('previewNotice');
      if (pn) pn.style.display = 'flex';

      loadProgress(course.id);
    }

    async function loadProgress(courseId) {
      try {
        var { data: { session } } = await _supabase.auth.getSession();
        if (!session) return;

        var { data: progress } = await _supabase
          .from('progress')
          .select('progress_pct')
          .eq('user_id', session.user.id)
          .eq('course_id', courseId)
          .single();

        if (!progress) return;
        var pct = progress.progress_pct || 0;
        _lastSavedPct = pct;
        var bar = document.getElementById('heroProgressBar');
        var txt = document.getElementById('heroProgressTxt');
        if (bar) bar.style.width = pct + '%';
        if (txt) txt.textContent = pct + '% 수강 완료';
      } catch(e) {}
    }

    document.addEventListener("DOMContentLoaded", init);
  })();
  </script>
</body>
</html>
