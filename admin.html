<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BI MATRIX 포털 관리자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }

    /* ── 사이드바 메뉴 아이템 ── */
    .sidebar-nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 12px;
      font-size: 14px; font-weight: 500;
      color: #94A3B8; cursor: pointer;
      transition: all 0.15s; text-decoration: none;
    }
    .sidebar-nav-item:hover { background: rgba(21,16,42,0.6); color: #fff; }
    .sidebar-nav-item.active { background: #25184A; color: #fff; font-weight: 700; box-shadow: 0 4px 12px rgba(37,24,74,0.4); }
    .sidebar-nav-item svg { flex-shrink: 0; }

    /* ── 동적 콘텐츠용 테이블 ── */
    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table th {
      padding: 10px 20px; background: #F9FAFB;
      font-size: 11px; font-weight: 700; color: #9CA3AF;
      text-align: left; letter-spacing: 0.06em; text-transform: uppercase;
      border-bottom: 1px solid #E8EEF4;
    }
    .admin-table td {
      padding: 13px 20px; font-size: 14px; color: #374151;
      border-bottom: 1px solid #F3F4F6; vertical-align: middle;
    }
    .admin-table tr:last-child td { border-bottom: none; }
    .admin-table tr:hover td { background: #FAFBFC; }

    /* ── 뱃지 ── */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-green  { background: #ECFDF5; color: #059669; }
    .badge-blue   { background: #EFF6FF; color: #2563EB; }
    .badge-purple { background: #F5F3FF; color: #7C3AED; }
    .badge-gray   { background: #F3F4F6; color: #6B7280; }
    .badge-gold   { background: #FFFBEB; color: #D97706; }
    .badge-today  { background: #FEF2F2; color: #DC2626; }
    .badge-warn   { background: #FFFBEB; color: #D97706; }
    .badge-urgent { background: #DC2626; color: #fff; }

    /* ── 진도 바 ── */
    .prog-bar-wrap  { display: flex; align-items: center; gap: 10px; }
    .prog-bar-track { flex: 1; height: 7px; background: #F3F4F6; border-radius: 99px; overflow: hidden; min-width: 60px; }
    .prog-bar-fill  { height: 100%; border-radius: 99px; transition: width 0.4s; }
    .check-done { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #ECFDF5; color: #059669; flex-shrink: 0; }

    /* ── 아바타 ── */
    .avatar-init { width: 34px; height: 34px; border-radius: 50%; color: #fff; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .user-cell { display: flex; align-items: center; gap: 10px; }
    .user-cell__name { font-weight: 700; font-size: 14px; color: #111827; line-height: 1.3; }
    .user-cell__sub  { font-size: 11px; color: #9CA3AF; margin-top: 2px; }

    /* ── 답변 버튼 ── */
    .answer-btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; background: #25184A; color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; transition: background 0.15s; }
    .answer-btn:hover { background: #322165; }

    /* ── 탭 (커뮤니티 내부) ── */
    .tab-row { display: flex; padding: 0 20px; border-bottom: 1px solid #E5E7EB; }
    .tab-btn { padding: 11px 16px; font-size: 14px; font-weight: 500; color: #6B7280; cursor: pointer; border: none; background: none; font-family: 'Noto Sans KR', sans-serif; position: relative; bottom: -1px; border-bottom: 2px solid transparent; transition: color 0.12s; }
    .tab-btn:hover { color: #111827; }
    .tab-btn.active { color: #25184A; border-bottom-color: #25184A; font-weight: 600; }

    /* ── 빈 상태 ── */
    .empty-row td { text-align: center; padding: 40px; color: #9CA3AF; font-size: 14px; }
    .empty-qa { text-align: center; padding: 52px 20px; }
    .empty-qa__icon { font-size: 40px; margin-bottom: 12px; }
    .empty-qa__text { font-size: 15px; font-weight: 700; color: #374151; margin-bottom: 6px; }
    .empty-qa__sub  { font-size: 13px; color: #9CA3AF; }

    /* ── 토스트 ── */
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(12px); background: #111827; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: all 0.25s; z-index: 9999; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── KPI 카드 ── */
    .kpi-card { background: #fff; border-radius: 20px; border: 1px solid #E8EEF4; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
    .kpi-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .kpi-icon--purple { background: #F5F3FF; color: #7C3AED; }
    .kpi-icon--fuchsia { background: #FDF4FF; color: #A21CAF; }
    .kpi-icon--rose { background: #FFF1F2; color: #E11D48; }
    .kpi-label { font-size: 11px; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .kpi-value { font-size: 30px; font-weight: 800; color: #1E293B; line-height: 1; }
    .kpi-value span { font-size: 14px; font-weight: 500; color: #9CA3AF; margin-left: 2px; }
    .kpi-sub { margin-top: 6px; font-size: 12px; }

    /* ── 어드민 카드 ── */
    .admin-card { background: #fff; border-radius: 20px; border: 1px solid #E8EEF4; margin-bottom: 20px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
    .admin-card-header { padding: 18px 22px; border-bottom: 1px solid #F3F4F6; display: flex; align-items: center; justify-content: space-between; background: rgba(249,250,251,0.5); }
    .admin-card-title { font-size: 15px; font-weight: 700; color: #1E293B; }

    /* ── 차트 바 ── */
    .chart-bar-wrap { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; height: 160px; padding: 0 4px; border-bottom: 2px solid #F1F5F9; }
    .chart-col { display: flex; flex-direction: column; align-items: center; flex: 1; gap: 6px; }
    .chart-bar { width: 100%; max-width: 32px; border-radius: 6px 6px 0 0; transition: all 0.3s; min-height: 4px; }
    .chart-bar.current-month { background: #25184A; }
    .chart-bar.other-month { background: #E9D5FF; }
    .chart-label { font-size: 10px; font-weight: 700; color: #9CA3AF; }
    .chart-label.current-month { color: #25184A; }

    @media (max-width: 900px) {
      .admin-sidebar { display: none !important; }
      .admin-main { margin-left: 0 !important; }
    }
  </style>
</head>

  <script>
  /* ── 관리자 이메일 화이트리스트 ── */
  var ADMIN_EMAILS = ['loveiswj@gmail.com', 'wjkim1363@bimatrix.co.kr'];

  var _currentTab = 'dashboard';
  var _data = { users: [], enrollments: [], progress: [], certificates: [], faqs: [], posts: [], comments: [] };
  var _userSearch = '';
  var _enrollSearch = '';

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2500);
  }

  function formatDate(d) {
    if (!d) return '—';
    var dt = new Date(d);
    return dt.getFullYear() + '. ' + (dt.getMonth()+1) + '. ' + dt.getDate() + '.';
  }
  function formatDateShort(d) {
    if (!d) return '—';
    var dt = new Date(d);
    var now = new Date();
    var diff = Math.floor((now - dt) / 86400000);
    if (diff === 0) return '오늘';
    if (diff === 1) return '어제';
    if (diff < 7)  return diff + '일 전';
    var m = dt.getMonth() + 1, day = dt.getDate();
    if (dt.getFullYear() === now.getFullYear()) return m + '월 ' + day + '일';
    return dt.getFullYear() + '. ' + m + '. ' + day + '.';
  }

  async function adminLogout() {
    await _supabase.auth.signOut();
    window.location.href = 'login.html';
  }

  /* ── 데이터 로드 ── */
  async function loadAll() {
    var [p, e, pr, c, fq, ps, cm] = await Promise.all([
      _supabase.from('profiles').select('*').order('created_at', { ascending: false }),
      _supabase.from('enrollments').select('*').order('enrolled_at', { ascending: false }),
      _supabase.from('progress').select('*'),
      _supabase.from('certificates').select('*'),
      _supabase.from('faqs').select('*').order('order_num').order('created_at'),
      _supabase.from('community_posts').select('*').order('created_at', { ascending: false }),
      _supabase.from('community_comments').select('*').order('created_at', { ascending: false })
    ]);
    _data.users        = p.data  || [];
    _data.enrollments  = e.data  || [];
    _data.progress     = pr.data || [];
    _data.certificates = c.data  || [];
    _data.faqs         = fq.data || [];
    _data.posts        = ps.data || [];
    _data.comments     = cm.data || [];
  }

  /* ── 탭 전환 ── */
  function showTab(tab) {
    _currentTab = tab;
    window.location.hash = tab;

    document.querySelectorAll('.sidebar-nav-item[data-tab]').forEach(function(el) {
      el.classList.toggle('active', el.dataset.tab === tab);
    });

    var titles = { dashboard:'대시보드', users:'수강생 관리', enrollments:'수강 현황', faq:'FAQ 관리', community:'커뮤니티 관리' };

  var AVATAR_COLORS = ['#6366F1','#2563EB','#059669','#D97706','#7C3AED','#0891B2','#DC2626'];

  function avatarCell(name, sub) {
    var n = name && name !== '—' ? name : '?';
    var initial = n.slice(0, 1);
    var bg = AVATAR_COLORS[n.charCodeAt(0) % AVATAR_COLORS.length];
    return '<div class="user-cell">' +
      '<div class="avatar-init" style="background:' + bg + ';">' + initial + '</div>' +

      (sub ? '<div class="user-cell__sub">' + escHtml(sub) + '</div>' : '') +

  function progressBar(pct) {
    var isDone = pct >= 100;
    return '<div class="prog-bar-wrap">' +
      '<div class="prog-bar-track"><div class="prog-bar-fill" style="width:' + pct + '%;background:' + (isDone ? '#10B981' : '#7C3AED') + ';"></div></div>' +
      '<span style="font-size:12px;font-weight:700;color:' + (isDone ? '#059669' : '#7C3AED') + ';min-width:34px;">' + pct + '%</span>' +
      (isDone ? '<div class="check-done">' + SVG.check + '</div>' : '') +
    '</div>';
  }

  /* ── 월별 가입 현황 계산 ── */
  function getMonthlySignups() {
    var now = new Date();
    var result = [];
    for (var i = 11; i >= 0; i--) {
      var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      var year = d.getFullYear();
      var month = d.getMonth() + 1;
      var count = _data.users.filter(function(u) {
        if (!u.created_at) return false;
        var ud = new Date(u.created_at);
        return ud.getFullYear() === year && (ud.getMonth() + 1) === month;
      }).length;
      result.push({ year: year, month: month, count: count });
    }
    return result;
  }

  /* ── 대시보드 ── */
  function renderDashboard() {
    var today     = new Date().toISOString().slice(0, 10);
    var yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    var nowMonth  = new Date().getMonth() + 1;
    var nowYear   = new Date().getFullYear();

    var totalUsers     = _data.users.length;
    var todayUsers     = _data.users.filter(function(u) { return (u.created_at || '').slice(0, 10) === today; }).length;
    var yesterdayUsers = _data.users.filter(function(u) { return (u.created_at || '').slice(0, 10) === yesterday; }).length;
    var thisMonthUsers = _data.users.filter(function(u) {
      if (!u.created_at) return false;
      var d = new Date(u.created_at);
      return d.getFullYear() === nowYear && (d.getMonth() + 1) === nowMonth;
    }).length;

    /* 미답변 Q&A */
    var unanswered = _data.posts.filter(function(p) {
      if (p.category !== 'qa') return false;
      return _data.comments.filter(function(c) { return c.post_id === p.id; }).length === 0;
    });

    var diff = todayUsers - yesterdayUsers;
    var todaySub = diff > 0
      ? '<span style="color:#059669;font-weight:700;">▲ ' + diff + '명 증가</span>'
      : diff < 0
      ? '<span style="color:#DC2626;font-weight:700;">▼ ' + Math.abs(diff) + '명 감소</span>'
      : '<span style="color:#9CA3AF;">전일과 동일</span>';

    var qaSub = unanswered.length > 0
      ? '<span style="background:#FEF2F2;color:#DC2626;padding:2px 9px;border-radius:20px;font-weight:700;">' + unanswered.length + '건 대기 중</span>'
      : '<span style="background:#ECFDF5;color:#059669;padding:2px 9px;border-radius:20px;font-weight:700;">모두 답변 완료</span>';

    var qaHeaderBadge = unanswered.length > 0
      ? '<span class="badge badge-today" style="padding:3px 11px;">' + unanswered.length + '건 대기중</span>'
      : '<span class="badge badge-green" style="padding:3px 11px;">모두 완료 ✓</span>';

    /* Q&A 테이블 */
    var qaBody;
    if (unanswered.length === 0) {
      qaBody = '<div class="empty-qa">' +
        '<div class="empty-qa__icon">✅</div>' +
        '<div class="empty-qa__text">미답변 질문이 없습니다</div>' +
        '<div class="empty-qa__sub">모든 Q&amp;A 질문에 답변이 완료되었습니다</div>' +
      '</div>';
    } else {
      var qaRows = unanswered.slice(0, 10).map(function(p) {
        var d = Math.floor((new Date() - new Date(p.created_at)) / 86400000);

          ? '<span class="badge badge-urgent">3일↑ 긴급</span>'
          : d >= 1
          ? '<span class="badge badge-warn">' + d + '일 전</span>'
          : '<span class="badge badge-today">오늘</span>';

          '<td style="color:#6B7280;">' + escHtml(p.author_name || '—') + '</td>' +
          '<td>' + badge + '</td>' +
          '<td><button class="answer-btn" onclick="showTab(\'community\');setTimeout(function(){openCommentWriteModal(' + p.id + ')},150)">' + SVG.arrow + ' 답변하기</button></td>' +
        '</tr>';
      }).join('');
      qaBody = '<table class="admin-table">' +
        '<thead><tr><th>질문 제목</th><th>작성자</th><th>경과</th><th>액션</th></tr></thead>' +
        '<tbody>' + qaRows + '</tbody>' +
      '</table>';
    }

    /* 최근 수강 신청 */
    var recentRows = _data.enrollments.slice(0, 8).map(function(e) {
      var user   = _data.users.find(function(u) { return u.id === e.user_id; });
      var course = COURSES.find(function(c) { return c.id === e.course_id; });
      var prog   = _data.progress.find(function(p) { return p.user_id === e.user_id && p.course_id === e.course_id; });
      var pct    = prog ? prog.progress_pct : 0;
      var displayName = user ? (user.name || user.email.split('@')[0]) : '—';
      var courseTitle = course ? course.title : '강의 #' + e.course_id;
      return '<tr>' +
        '<td>' + avatarCell(displayName, null) + '</td>' +
        '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:#374151;" title="' + escHtml(courseTitle) + '">' +
          escHtml(courseTitle.slice(0, 30) + (courseTitle.length > 30 ? '…' : '')) +
        '</td>' +
        '<td style="font-size:13px;color:#6B7280;">' + formatDateShort(e.enrolled_at) + '</td>' +
        '<td>' + progressBar(pct) + '</td>' +
      '</tr>';
    }).join('');

    /* 월별 차트 */
    var monthly = getMonthlySignups();
    var maxCount = Math.max.apply(null, monthly.map(function(m) { return m.count; })) || 1;
    var nowM = new Date().getMonth() + 1;
    var nowY = new Date().getFullYear();
    var chartBars = monthly.map(function(m) {
      var isCurrent = m.year === nowY && m.month === nowM;
      var heightPct = Math.max(Math.round((m.count / maxCount) * 100), m.count > 0 ? 6 : 2);
      var barStyle = 'height:' + heightPct + '%;' + (isCurrent ? 'background:#25184A;' : 'background:#DDD6FE;');
      return '<div class="chart-col">' +
        (isCurrent ? '<span style="font-size:9px;font-weight:800;color:#25184A;background:#EDE9FE;border-radius:4px;padding:2px 5px;">당월</span>' : '') +
        '<div class="chart-bar ' + (isCurrent ? 'current-month' : 'other-month') + '" style="width:100%;max-width:32px;border-radius:6px 6px 0 0;' + (isCurrent ? 'background:#25184A;' : 'background:#DDD6FE;') + 'height:' + heightPct + '%;min-height:4px;align-self:flex-end;"></div>' +
        '<span style="font-size:10px;font-weight:700;' + (isCurrent ? 'color:#25184A;' : 'color:#9CA3AF;') + '">' + m.month + '월</span>' +
      '</div>';
    }).join('');

    return '' +
    /* KPI 3종 */
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;">' +
      kpiCard('전체 회원가입 현황', totalUsers, '명', { icon: SVG.users, iconBg:'#F5F3FF', iconColor:'#7C3AED', sub:'<span style="color:#9CA3AF;">누적 가입 회원</span>' }) +
      kpiCard('오늘 신규 가입', todayUsers, '명', { icon: SVG.userPlus, iconBg:'#FDF4FF', iconColor:'#A21CAF', sub: todaySub }) +
      kpiCard('미답변 Q&amp;A', unanswered.length, '건', { icon: SVG.msg, iconBg:'#FFF1F2', iconColor:'#E11D48', sub: qaSub, ping: unanswered.length > 0 }) +
    '</div>' +

    /* 월별 차트 */
    '<div class="admin-card" style="margin-bottom:20px;">' +
      '<div class="admin-card-header">' +
        '<div style="display:flex;align-items:center;gap:12px;">' +
          '<span class="admin-card-title">월별 신규 가입 현황</span>' +
          '<span style="font-size:11px;font-weight:700;color:#7C3AED;background:#F5F3FF;padding:3px 10px;border-radius:20px;">당월 신규: ' + thisMonthUsers + '명</span>' +
        '</div>' +
        '<span style="font-size:11px;color:#9CA3AF;">단위: 명</span>' +
      '</div>' +
      '<div style="padding:24px 20px 8px;">' +
        '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:140px;">' +
          chartBars +
        '</div>' +
      '</div>' +
    '</div>' +

    /* Q&A */
    '<div class="admin-card" style="margin-bottom:20px;">' +
      '<div class="admin-card-header">' +
        '<div style="display:flex;align-items:center;gap:10px;">' +
          '<span class="admin-card-title">미답변 Q&amp;A</span>' +
          qaHeaderBadge +
        '</div>' +
        '<span style="font-size:11px;color:#9CA3AF;">답변 대기 시간이 지체되지 않도록 관리해 주세요</span>' +
      '</div>' +
      qaBody +
    '</div>' +

    /* 최근 수강 */
    '<div class="admin-card">' +
      '<div class="admin-card-header">' +
        '<span class="admin-card-title">최근 수강 신청</span>' +
        '<span style="font-size:11px;color:#9CA3AF;">최근 8건</span>' +
      '</div>' +
      '<table class="admin-table">' +
        '<thead><tr><th>수강생</th><th>강의</th><th>신청일</th><th>진도율</th></tr></thead>' +
        '<tbody>' + (recentRows || '<tr class="empty-row"><td colspan="4">수강 내역이 없습니다</td></tr>') + '</tbody>' +
      '</table>' +
    '</div>';
  }

  function kpiCard(label, value, unit, opts) {
    opts = opts || {};
    var pingDot = opts.ping
      ? '<span style="position:absolute;top:-4px;right:-4px;width:14px;height:14px;background:#EF4444;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff;font-weight:800;">' + value + '</span>'
      : '';
    return '<div class="kpi-card">' +
      '<div>' +
        '<p class="kpi-label">' + label + '</p>' +
        '<div class="kpi-value">' + value + '<span>' + unit + '</span></div>' +
        (opts.sub ? '<div class="kpi-sub">' + opts.sub + '</div>' : '') +
      '</div>' +
      '<div style="position:relative;">' +
        '<div class="kpi-icon" style="background:' + (opts.iconBg||'#F5F3FF') + ';color:' + (opts.iconColor||'#7C3AED') + ';">' + (opts.icon||'') + '</div>' +
        pingDot +
      '</div>' +
    '</div>';
  }

  /* ── 수강생 관리 ── */
  function renderUsers(search) {
    var list = _data.users;
    if (search) {
      var q = search.toLowerCase();
      list = list.filter(function(u) {
        return (u.name && u.name.toLowerCase().includes(q)) ||
               (u.email && u.email.toLowerCase().includes(q)) ||
               (u.phone && u.phone.includes(q)) ||
               (u.company && u.company.toLowerCase().includes(q)) ||
               (u.department && u.department.toLowerCase().includes(q));
      });
    }

    var rows = list.map(function(u) {
      var userEnrs = _data.enrollments.filter(function(e) { return e.user_id === u.id; });
      var progList = _data.progress.filter(function(p) { return p.user_id === u.id; });
      var avgPct   = progList.length > 0
        ? Math.round(progList.reduce(function(s, p) { return s + (p.progress_pct||0); }, 0) / progList.length) : 0;
      return '<tr>' +
        '<td>' + avatarCell(u.name || '—', null) + '</td>' +
        '<td style="color:#6B7280;font-size:13px;">' + escHtml(u.email || '—') + '</td>' +
        '<td>' + escHtml(u.phone || '—') + '</td>' +
        '<td>' + escHtml(u.company || '—') + '</td>' +
        '<td>' + escHtml(u.department || '—') + '</td>' +
        '<td><span class="badge badge-purple">' + userEnrs.length + '개</span></td>' +
        '<td style="font-size:13px;">' + avgPct + '%</td>' +
        '<td style="font-size:12px;color:#9CA3AF;">' + formatDate(u.created_at) + '</td>' +
      '</tr>';
    }).join('');

    return '<div class="admin-card">' +
      '<div class="admin-card-header">' +
        '<span class="admin-card-title">전체 수강생 (' + list.length + '명)</span>' +
        '<input type="text" placeholder="이름·회사·연락처 검색" value="' + escHtml(search||'') + '" ' +
          'oninput="_userSearch=this.value;renderTab(\'users\')" ' +
          'style="padding:8px 14px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:13px;font-family:\'Noto Sans KR\',sans-serif;width:200px;outline:none;">' +
      '</div>' +

        '<thead><tr><th>이름</th><th>이메일</th><th>연락처</th><th>회사명</th><th>소속/부서</th><th>수강</th><th>평균진도</th><th>가입일</th></tr></thead>' +
        '<tbody>' + (rows || '<tr class="empty-row"><td colspan="8">검색 결과가 없습니다</td></tr>') + '</tbody>' +
      '</table>' +
    '</div>';
  }

    modal.style.display = 'flex';
  }

  function closeFAQModal() {
    document.getElementById('faqModal').style.display = 'none';
  }

  async function saveFAQ() {
    var id       = document.getElementById('faqId').value;
    var category = document.getElementById('faqCategory').value.trim();
    var question = document.getElementById('faqQuestion').value.trim();
    var answer   = document.getElementById('faqAnswer').value.trim();
    var pub      = document.getElementById('faqPublished').checked;
    if (!question || !answer) { showToast('질문과 답변을 입력해주세요'); return; }

    var payload = { category: category, question: question, answer: answer, is_published: pub, updated_at: new Date().toISOString() };
    var res;
    if (id) {
      res = await _supabase.from('faqs').update(payload).eq('id', parseInt(id));
    } else {
      payload.order_num = _data.faqs.length;
      res = await _supabase.from('faqs').insert(payload);
    }

    if (res.error) { showToast('저장 실패: ' + res.error.message); return; }
    showToast(id ? 'FAQ가 수정되었습니다' : 'FAQ가 등록되었습니다');
    closeFAQModal();
    var fqRes = await _supabase.from('faqs').select('*').order('order_num').order('created_at');
    _data.faqs = fqRes.data || [];
    renderFAQTab();
  }

  async function deleteFAQ(id) {
    if (!confirm('이 FAQ를 삭제하시겠습니까?')) return;
    var res = await _supabase.from('faqs').delete().eq('id', id);
    if (res.error) { showToast('삭제 실패: ' + res.error.message); return; }
    showToast('FAQ가 삭제되었습니다');
    _data.faqs = _data.faqs.filter(function(f) { return f.id !== id; });
    renderFAQTab();
  }

  /* ── 커뮤니티 관리 ── */
  var _commTab = 'posts';
  var POST_CAT_MAP = { notice:'공지', qa:'Q&A', review:'후기', free:'자유' };

  async function renderCommunityTab() {
    var el = document.getElementById('adminContent');
    el.innerHTML =
      '<div class="admin-card">' +
        '<div class="tab-row">' +
          '<button class="tab-btn' + (_commTab==='posts'?' active':'') + '" onclick="_commTab=\'posts\';renderCommunityTab()">게시글 (' + _data.posts.length + ')</button>' +
          '<button class="tab-btn' + (_commTab==='comments'?' active':'') + '" onclick="_commTab=\'comments\';renderCommunityTab()">댓글 (' + _data.comments.length + ')</button>' +
        '</div>' +
        '<div id="commTabContent"></div>' +
      '</div>';

    if (_commTab === 'posts') renderPostsPanel();
    else renderCommentsPanel();
  }

  function renderPostsPanel() {
    var rows = _data.posts.length === 0
      ? '<tr class="empty-row"><td colspan="6">게시글이 없습니다</td></tr>'
      : _data.posts.map(function(p) {
          var catLabel = POST_CAT_MAP[p.category] || p.category;
          var badges = (p.is_pinned ? '<span class="badge badge-gold" style="margin-right:2px;">📌고정</span>' : '') +
                       (p.is_hidden ? '<span class="badge badge-gray">숨김</span>' : '<span class="badge badge-green">공개</span>');
          return '<tr>' +
            '<td><span class="badge badge-purple">' + catLabel + '</span></td>' +
            '<td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(p.title) + '</td>' +
            '<td>' + escHtml(p.author_name) + '</td>' +
            '<td style="text-align:center;">' + _data.comments.filter(function(c){return c.post_id===p.id;}).length + '</td>' +
            '<td>' + badges + '</td>' +
            '<td style="white-space:nowrap;">' +
              '<button onclick="pinPost(' + p.id + ',' + (!p.is_pinned) + ')" style="' + btnStyle('#FFFBEB','#D97706') + '">' + (p.is_pinned?'고정해제':'고정') + '</button> ' +
              '<button onclick="hidePost(' + p.id + ',' + (!p.is_hidden) + ')" style="' + btnStyle('#F3F4F6','#374151') + '">' + (p.is_hidden?'공개':'숨김') + '</button> ' +
              '<button onclick="deletePost(' + p.id + ')" style="' + btnStyle('#FEF2F2','#DC2626') + '">삭제</button>' +
            '</td>' +
          '</tr>';
        }).join('');

    document.getElementById('commTabContent').innerHTML =
      '<div style="padding:14px 20px;border-bottom:1px solid #F3F4F6;display:flex;justify-content:flex-end;">' +
        '<button onclick="openCommentWriteModal(null)" style="padding:9px 18px;background:#25184A;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:\'Noto Sans KR\',sans-serif;">+ 관리자 댓글 작성</button>' +
      '</div>' +
      '<table class="admin-table">' +
        '<thead><tr><th>유형</th><th>제목</th><th>작성자</th><th>댓글</th><th>상태</th><th>작업</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>';
  }

  function renderCommentsPanel() {
    var rows = _data.comments.length === 0
      ? '<tr class="empty-row"><td colspan="4">댓글이 없습니다</td></tr>'
      : _data.comments.map(function(c) {
          var post = _data.posts.find(function(p){return p.id===c.post_id;});
          return '<tr>' +
            '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:#9CA3AF;">' + (post ? escHtml(post.title) : '#' + c.post_id) + '</td>' +
            '<td>' + escHtml(c.author_name) + '</td>' +
            '<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(c.content) + '</td>' +
            '<td><button onclick="deleteComment(' + c.id + ')" style="' + btnStyle('#FEF2F2','#DC2626') + '">삭제</button></td>' +
          '</tr>';
        }).join('');

    document.getElementById('commTabContent').innerHTML =
      '<table class="admin-table">' +
        '<thead><tr><th>게시글</th><th>작성자</th><th>댓글 내용</th><th>작업</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>';
  }

  async function pinPost(id, val) {
    var res = await _supabase.from('community_posts').update({ is_pinned: val }).eq('id', id);
    if (res.error) { showToast('오류: ' + res.error.message); return; }
    var p = _data.posts.find(function(p){return p.id===id;}); if (p) p.is_pinned = val;
    showToast(val ? '게시글이 고정되었습니다' : '고정이 해제되었습니다');
    renderCommunityTab();
  }

  async function hidePost(id, val) {
    var res = await _supabase.from('community_posts').update({ is_hidden: val }).eq('id', id);
    if (res.error) { showToast('오류: ' + res.error.message); return; }
    var p = _data.posts.find(function(p){return p.id===id;}); if (p) p.is_hidden = val;
    showToast(val ? '게시글이 숨김 처리되었습니다' : '게시글이 공개되었습니다');
    renderCommunityTab();
  }

  async function deletePost(id) {
    if (!confirm('이 게시글과 모든 댓글을 삭제하시겠습니까?')) return;
    var res = await _supabase.from('community_posts').delete().eq('id', id);
    if (res.error) { showToast('삭제 실패: ' + res.error.message); return; }
    _data.posts    = _data.posts.filter(function(p){return p.id!==id;});
    _data.comments = _data.comments.filter(function(c){return c.post_id!==id;});
    showToast('게시글이 삭제되었습니다');
    renderCommunityTab();
  }

  async function deleteComment(id) {
    if (!confirm('이 댓글을 삭제하시겠습니까?')) return;
    var res = await _supabase.from('community_comments').delete().eq('id', id);
    if (res.error) { showToast('삭제 실패: ' + res.error.message); return; }
    _data.comments = _data.comments.filter(function(c){return c.id!==id;});
    showToast('댓글이 삭제되었습니다');
    renderCommunityTab();
  }

  /* ── 관리자 댓글 작성 모달 ── */
  function openCommentWriteModal(postId) {
    var modal = document.getElementById('commentModal');
    var sel = document.getElementById('commentPostSelect');
    sel.innerHTML = _data.posts.map(function(p) {
      return '<option value="' + p.id + '"' + (postId===p.id?' selected':'') + '>' + escHtml(p.title.slice(0,40)) + '</option>';
    }).join('');
    document.getElementById('commentContent').value = '';
    modal.style.display = 'flex';
  }

  function closeCommentModal() {
    document.getElementById('commentModal').style.display = 'none';
  }

  async function saveComment() {
    var postId  = parseInt(document.getElementById('commentPostSelect').value);
    var content = document.getElementById('commentContent').value.trim();
    if (!content) { showToast('댓글 내용을 입력해주세요'); return; }

    var { data: { session } } = await _supabase.auth.getSession();
    var res = await _supabase.from('community_comments').insert({
      post_id: postId, author_id: session.user.id,
      author_name: '운영팀', content: content
    });
    if (res.error) { showToast('등록 실패: ' + res.error.message); return; }
    showToast('댓글이 등록되었습니다');
    closeCommentModal();
    var cmRes = await _supabase.from('community_comments').select('*').order('created_at', { ascending: false });
    _data.comments = cmRes.data || [];
    renderCommunityTab();
  }

  /* ── 공통 헬퍼 ── */
  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function btnStyle(bg, color) {
    return 'padding:5px 10px;background:' + bg + ';color:' + color + ';border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;font-family:\'Noto Sans KR\',sans-serif;';
  }

  /* ── 초기화 ── */
  async function init() {
    var { data: { session } } = await _supabase.auth.getSession();
    if (!session) { window.location.href = 'login.html?returnTo=admin.html'; return; }

    if (!ADMIN_EMAILS.includes(session.user.email)) {
      alert('관리자 권한이 없습니다.');
      window.location.href = 'index.html';
      return;
    }

    var email = session.user.email;
    document.getElementById('adminEmail').textContent = email;
    document.getElementById('sidebarEmail').textContent = email;
    document.getElementById('sidebarAvatar').textContent = email.charAt(0).toUpperCase();

    await loadAll();

    var hash = window.location.hash.replace('#', '');
    var validTabs = ['dashboard','users','enrollments','faq','community'];
    var initTab = validTabs.includes(hash) ? hash : 'dashboard';
    showTab(initTab);
  }

  init();
  </script>
</body>
</html>
