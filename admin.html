<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드 — AUD Academy</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { background: #F7F8FA; font-family: var(--font); min-height: 100vh; color: #111827; }

    /* ── 레이아웃 ── */
    .admin-layout { display: flex; min-height: 100vh; }

    /* ── 사이드바 (흰 배경) ── */
    .sidebar {
      width: 216px; flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #E5E7EB;
      position: fixed; top: 0; left: 0; bottom: 0;
      overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .sidebar-logo {
      padding: 18px 16px 14px;
      border-bottom: 1px solid #F3F4F6;
      margin-bottom: 6px;
    }
    .sidebar-logo img { height: 22px; }
    .sidebar-logo__sub {
      font-size: 12px; color: #9CA3AF; margin-top: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sidebar-section {
      font-size: 11px; font-weight: 600; letter-spacing: 0.07em;
      color: #9CA3AF; text-transform: uppercase;
      padding: 14px 16px 4px;
    }
    .sidebar-menu-item {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 12px; margin: 1px 8px;
      border-radius: 6px;
      font-size: 14px; font-weight: 500; color: #6B7280;
      cursor: pointer; transition: background 0.12s, color 0.12s;
      text-decoration: none; border-left: 3px solid transparent;
    }
    .sidebar-menu-item:hover { background: #F9FAFB; color: #111827; }
    .sidebar-menu-item.active {
      background: #EFF6FF; color: #2563EB; font-weight: 600;
      border-left-color: #2563EB;
    }
    .sidebar-menu-item svg { flex-shrink: 0; opacity: 0.7; }
    .sidebar-menu-item.active svg { opacity: 1; }
    .sidebar-logout {
      margin-top: auto; padding: 12px 8px;
      border-top: 1px solid #F3F4F6;
    }

    /* ── 메인 ── */
    .admin-main { margin-left: 216px; flex: 1; min-width: 0; }
    .admin-topbar {
      background: #fff; border-bottom: 1px solid #E5E7EB;
      padding: 12px 28px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .admin-topbar h1 { font-size: 17px; font-weight: 700; color: #111827; }
    .admin-topbar-right { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6B7280; }
    .admin-content { padding: 24px 28px; }

    /* ── KPI 카드 ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    .kpi-card {
      background: #fff; border-radius: 8px;
      border: 1px solid #E5E7EB; padding: 20px 22px;
    }
    .kpi-label { font-size: 12px; font-weight: 500; color: #6B7280; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
    .kpi-value { font-size: 28px; font-weight: 700; color: #111827; line-height: 1; }
    .kpi-value span { font-size: 14px; font-weight: 400; color: #9CA3AF; margin-left: 2px; }

    /* ── 카드 ── */
    .admin-card {
      background: #fff; border-radius: 8px;
      border: 1px solid #E5E7EB; margin-bottom: 18px; overflow: hidden;
    }
    .admin-card-header {
      padding: 15px 20px; border-bottom: 1px solid #F3F4F6;
      display: flex; align-items: center; justify-content: space-between;
    }
    .admin-card-title { font-size: 14px; font-weight: 600; color: #111827; }

    /* ── 테이블 ── */
    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table th {
      padding: 10px 16px; background: #F9FAFB;
      font-size: 12px; font-weight: 600; color: #6B7280;
      text-align: left; letter-spacing: 0.04em; text-transform: uppercase;
      border-bottom: 1px solid #E5E7EB;
    }
    .admin-table td {
      padding: 13px 16px; font-size: 14px; color: #374151;
      border-bottom: 1px solid #F3F4F6;
    }
    .admin-table tr:last-child td { border-bottom: none; }
    .admin-table tr:hover td { background: #FAFAFA; }

    /* ── 뱃지 ── */
    .badge {
      display: inline-block; padding: 3px 10px;
      border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .badge-green { background: #ECFDF5; color: #059669; }
    .badge-blue  { background: #EFF6FF; color: #2563EB; }
    .badge-gray  { background: #F3F4F6; color: #6B7280; }
    .badge-gold  { background: #FFFBEB; color: #D97706; }

    /* ── 빈 상태 / 로딩 ── */
    .empty-row td { text-align: center; padding: 40px; color: #9CA3AF; font-size: 14px; }
    .loading { text-align: center; padding: 60px; color: #9CA3AF; font-size: 14px; }

    /* ── 탭 ── */
    .tab-row {
      display: flex; padding: 0 20px;
      border-bottom: 1px solid #E5E7EB;
    }
    .tab-btn {
      padding: 11px 16px; font-size: 14px; font-weight: 500;
      color: #6B7280; cursor: pointer;
      border: none; background: none; font-family: var(--font);
      position: relative; bottom: -1px;
      border-bottom: 2px solid transparent;
      transition: color 0.12s;
    }
    .tab-btn:hover { color: #111827; }
    .tab-btn.active { color: #2563EB; border-bottom-color: #2563EB; font-weight: 600; }

    /* ── 토스트 ── */
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #111827; color: #fff;
      padding: 10px 20px; border-radius: 7px;
      font-size: 13px; opacity: 0; transition: all 0.25s;
      z-index: 9999; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 900px) {
      .sidebar { width: 56px; }
      .sidebar-logo__sub, .sidebar-section { display: none; }
      .sidebar-logo img { height: 18px; }
      .sidebar-menu-item span { display: none; }
      .sidebar-menu-item { justify-content: center; padding: 10px; margin: 1px 4px; }
      .admin-main { margin-left: 56px; }
      .kpi-grid { grid-template-columns: 1fr 1fr; }
      .admin-content { padding: 16px; }
    }
  </style>
</head>
<body>
<div class="admin-layout">

  <!-- 사이드바 -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <img src="assets/images/bimatrix_logo.png" alt="AUD Academy">
      <div class="sidebar-logo__sub" id="sidebarEmail">관리자</div>
    </div>

    <div class="sidebar-section">관리</div>
    <a class="sidebar-menu-item active" data-tab="dashboard" onclick="showTab('dashboard')">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>대시보드</span>
    </a>
    <a class="sidebar-menu-item" data-tab="users" onclick="showTab('users')">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>수강생 관리</span>
    </a>
    <a class="sidebar-menu-item" data-tab="enrollments" onclick="showTab('enrollments')">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253"/></svg>
      <span>수강 현황</span>
    </a>

    <div class="sidebar-section">콘텐츠</div>
    <a class="sidebar-menu-item" data-tab="faq" onclick="showTab('faq')">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span>FAQ 관리</span>
    </a>
    <a class="sidebar-menu-item" data-tab="community" onclick="showTab('community')">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>커뮤니티 관리</span>
    </a>

    <div class="sidebar-logout">
      <a class="sidebar-menu-item" href="index.html" target="_blank" style="margin:0;">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15,3 21,3 21,9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        <span>사이트 보기</span>
      </a>
      <a class="sidebar-menu-item" onclick="adminLogout()" style="margin:0;color:#EF4444;">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>로그아웃</span>
      </a>
    </div>
  </nav>

  <!-- 메인 -->
  <div class="admin-main">
    <div class="admin-topbar">
      <h1 id="pageTitle">대시보드</h1>
      <div class="admin-topbar-right">
        <span id="adminEmail" style="color:#6B7280;"></span>
      </div>
    </div>

    <div class="admin-content" id="adminContent">
      <div class="loading">데이터를 불러오는 중...</div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- FAQ 추가/수정 모달 -->
<div id="faqModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9000;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:32px;width:560px;max-width:95vw;max-height:90vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
      <h2 id="faqModalTitle" style="font-size:17px;font-weight:800;color:var(--navy);">FAQ 추가</h2>
      <button onclick="closeFAQModal()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-hint);">✕</button>
    </div>
    <input type="hidden" id="faqId">
    <div style="margin-bottom:16px;">
      <label style="display:block;font-size:12px;font-weight:700;color:var(--text-hint);margin-bottom:6px;">카테고리</label>
      <select id="faqCategory" style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--font);">
        <option>일반</option><option>수강</option><option>기술지원</option><option>기타</option>
      </select>
    </div>
    <div style="margin-bottom:16px;">
      <label style="display:block;font-size:12px;font-weight:700;color:var(--text-hint);margin-bottom:6px;">질문 *</label>
      <input id="faqQuestion" type="text" placeholder="질문을 입력하세요" style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--font);box-sizing:border-box;">
    </div>
    <div style="margin-bottom:16px;">
      <label style="display:block;font-size:12px;font-weight:700;color:var(--text-hint);margin-bottom:6px;">답변 *</label>
      <textarea id="faqAnswer" rows="5" placeholder="답변을 입력하세요" style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--font);resize:vertical;box-sizing:border-box;"></textarea>
    </div>
    <div style="margin-bottom:24px;display:flex;align-items:center;gap:10px;">
      <input type="checkbox" id="faqPublished" checked style="width:16px;height:16px;cursor:pointer;">
      <label for="faqPublished" style="font-size:14px;font-weight:600;cursor:pointer;">공개 (FAQ 페이지에 표시)</label>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button onclick="closeFAQModal()" style="padding:10px 20px;background:#F3F4F6;color:var(--text-primary);border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);">취소</button>
      <button onclick="saveFAQ()" style="padding:10px 20px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);">저장</button>
    </div>
  </div>
</div>

<!-- 관리자 댓글 작성 모달 -->
<div id="commentModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9000;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:32px;width:520px;max-width:95vw;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
      <h2 style="font-size:17px;font-weight:800;color:var(--navy);">관리자 댓글 작성</h2>
      <button onclick="closeCommentModal()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-hint);">✕</button>
    </div>
    <div style="margin-bottom:16px;">
      <label style="display:block;font-size:12px;font-weight:700;color:var(--text-hint);margin-bottom:6px;">게시글 선택</label>
      <select id="commentPostSelect" style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--font);"></select>
    </div>
    <div style="margin-bottom:24px;">
      <label style="display:block;font-size:12px;font-weight:700;color:var(--text-hint);margin-bottom:6px;">댓글 내용 *</label>
      <textarea id="commentContent" rows="4" placeholder="댓글 내용을 입력하세요" style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--font);resize:vertical;box-sizing:border-box;"></textarea>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <button onclick="closeCommentModal()" style="padding:10px 20px;background:#F3F4F6;color:var(--text-primary);border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);">취소</button>
      <button onclick="saveComment()" style="padding:10px 20px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);">등록</button>
    </div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/course-data.js"></script>
<script>
  /* ── 관리자 이메일 화이트리스트 ── */
  var ADMIN_EMAILS = ['loveiswj@gmail.com', 'wjkim1363@bimatrix.co.kr'];

  var _currentTab = 'dashboard';
  var _data = { users: [], enrollments: [], progress: [], certificates: [], faqs: [], posts: [], comments: [] };
  var _userSearch = '';
  var _enrollSearch = '';

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2500);
  }

  function formatPrice(n) { return (n || 0).toLocaleString('ko-KR') + '원'; }
  function formatDate(d) {
    if (!d) return '—';
    var dt = new Date(d);
    return dt.getFullYear() + '. ' + (dt.getMonth()+1) + '. ' + dt.getDate() + '.';
  }

  async function adminLogout() {
    await _supabase.auth.signOut();
    window.location.href = 'login.html';
  }

  /* ── 데이터 로드 ── */
  async function loadAll() {
    var [p, e, pr, c, fq, ps, cm] = await Promise.all([
      _supabase.from('profiles').select('*').order('created_at', { ascending: false }),
      _supabase.from('enrollments').select('*').order('enrolled_at', { ascending: false }),
      _supabase.from('progress').select('*'),
      _supabase.from('certificates').select('*'),
      _supabase.from('faqs').select('*').order('order_num').order('created_at'),
      _supabase.from('community_posts').select('*').order('created_at', { ascending: false }),
      _supabase.from('community_comments').select('*').order('created_at', { ascending: false })
    ]);
    _data.users        = p.data  || [];
    _data.enrollments  = e.data  || [];
    _data.progress     = pr.data || [];
    _data.certificates = c.data  || [];
    _data.faqs         = fq.data || [];
    _data.posts        = ps.data || [];
    _data.comments     = cm.data || [];
  }

  /* ── 탭 전환 (URL hash 유지) ── */
  function showTab(tab) {
    _currentTab = tab;
    window.location.hash = tab;
    document.querySelectorAll('.sidebar-menu-item[data-tab]').forEach(function(el) {
      el.classList.toggle('active', el.dataset.tab === tab);
    });
    var titles = { dashboard:'대시보드', users:'수강생 관리', enrollments:'수강 현황', faq:'FAQ 관리', community:'커뮤니티 관리' };
    document.getElementById('pageTitle').textContent = titles[tab] || tab;
    renderTab(tab);
  }

  function renderTab(tab) {
    var el = document.getElementById('adminContent');
    if (tab === 'dashboard')   el.innerHTML = renderDashboard();
    if (tab === 'users')       el.innerHTML = renderUsers(_userSearch);
    if (tab === 'enrollments') el.innerHTML = renderEnrollments(_enrollSearch);
    if (tab === 'faq')         renderFAQTab();
    if (tab === 'community')   renderCommunityTab();
  }

  /* ── 대시보드 ── */
  function renderDashboard() {
    var today = new Date().toISOString().slice(0, 10);

    var totalUsers   = _data.users.length;
    var todayUsers   = _data.users.filter(function(u) { return (u.created_at || '').slice(0, 10) === today; }).length;

    /* 미답변 Q&A */
    var unanswered = _data.posts.filter(function(p) {
      if (p.category !== 'qa') return false;
      return _data.comments.filter(function(c) { return c.post_id === p.id; }).length === 0;
    });

    var unansweredRows = unanswered.length === 0
      ? '<tr class="empty-row"><td colspan="4">미답변 Q&A가 없습니다 ✅</td></tr>'
      : unanswered.slice(0, 10).map(function(p) {
          var d = Math.floor((new Date() - new Date(p.created_at)) / 86400000);
          var badge = d >= 3
            ? '<span class="badge" style="background:#FEF2F2;color:#DC2626;">3일↑</span>'
            : d >= 1
            ? '<span class="badge" style="background:#FFFBEB;color:#D97706;">' + d + '일 전</span>'
            : '<span class="badge badge-green">오늘</span>';
          return '<tr>' +
            '<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(p.title) + '</td>' +
            '<td>' + escHtml(p.author_name) + '</td>' +
            '<td>' + badge + '</td>' +
            '<td><button onclick="showTab(\'community\');setTimeout(function(){openCommentWriteModal(' + p.id + ')},150)" ' +
              'style="' + btnStyle('#2563EB','#fff') + '">답변하기</button></td>' +
          '</tr>';
        }).join('');

    var recentRows = _data.enrollments.slice(0, 8).map(function(e) {
      var user   = _data.users.find(function(u) { return u.id === e.user_id; });
      var course = COURSES.find(function(c) { return c.id === e.course_id; });
      var prog   = _data.progress.find(function(p) { return p.user_id === e.user_id && p.course_id === e.course_id; });
      var pct    = prog ? prog.progress_pct : 0;
      return '<tr>' +
        '<td><strong>' + (user ? (user.name || user.email.split('@')[0]) : '—') + '</strong></td>' +
        '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + (course ? course.title : '') + '">' + (course ? course.title.slice(0,28) + (course.title.length>28?'…':'') : '강의 #' + e.course_id) + '</td>' +
        '<td>' + formatDate(e.enrolled_at) + '</td>' +
        '<td>' +
          '<div style="display:flex;align-items:center;gap:8px;">' +
            '<div style="flex:1;height:6px;background:#F3F4F6;border-radius:3px;overflow:hidden;min-width:60px;">' +
              '<div style="height:100%;background:' + (pct>=100?'#10B981':'var(--navy)') + ';width:' + pct + '%;"></div>' +
            '</div>' +
            '<span style="font-size:12px;font-weight:700;color:var(--navy);min-width:32px;">' + pct + '%</span>' +
          '</div>' +
        '</td>' +
      '</tr>';
    }).join('');

    return '' +
    '<div class="kpi-grid">' +
      kpiCard('전체 수강생', totalUsers, '명') +
      kpiCard('오늘 신규 가입', todayUsers, '명') +
      kpiCard('미답변 Q&amp;A', unanswered.length, '건') +
    '</div>' +

    '<div class="admin-card" style="margin-bottom:24px;">' +
      '<div class="admin-card-header">' +
        '<span class="admin-card-title">미답변 Q&amp;A</span>' +
        (unanswered.length > 0
          ? '<span class="badge" style="background:#FEF2F2;color:#DC2626;font-size:13px;">' + unanswered.length + '건 대기중</span>'
          : '<span class="badge badge-green">모두 답변 완료</span>') +
      '</div>' +
      '<table class="admin-table">' +
        '<thead><tr><th>질문 제목</th><th>작성자</th><th>경과</th><th>액션</th></tr></thead>' +
        '<tbody>' + unansweredRows + '</tbody>' +
      '</table>' +
    '</div>' +

    '<div class="admin-card">' +
      '<div class="admin-card-header">' +
        '<span class="admin-card-title">최근 수강 신청</span>' +
        '<span style="font-size:12px;color:var(--text-hint);">최근 8건</span>' +
      '</div>' +
      '<table class="admin-table">' +
        '<thead><tr><th>이름</th><th>강의</th><th>신청일</th><th>진도율</th></tr></thead>' +
        '<tbody>' + (recentRows || '<tr class="empty-row"><td colspan="4">수강 내역이 없습니다</td></tr>') + '</tbody>' +
      '</table>' +
    '</div>';
  }

  function kpiCard(label, value, unit) {
    return '<div class="kpi-card">' +
      '<div class="kpi-label">' + label + '</div>' +
      '<div class="kpi-value">' + value + '<span>' + unit + '</span></div>' +
    '</div>';
  }

  function todayKpiCard(label, value, unit, icon) {
    return '<div class="kpi-card" style="background:linear-gradient(135deg,#F8FAFC,#fff);">' +
      '<div class="kpi-label">' + icon + ' ' + label + '</div>' +
      '<div class="kpi-value" style="font-size:24px;">' + value + '<span>' + unit + '</span></div>' +
    '</div>';
  }

  /* ── 수강생 관리 ── */
  function renderUsers(search) {
    var list = _data.users;
    if (search) {
      var q = search.toLowerCase();
      list = list.filter(function(u) {
        return (u.name && u.name.toLowerCase().includes(q)) ||
               (u.email && u.email.toLowerCase().includes(q)) ||
               (u.phone && u.phone.includes(q)) ||
               (u.company && u.company.toLowerCase().includes(q)) ||
               (u.department && u.department.toLowerCase().includes(q));
      });
    }

    var rows = list.map(function(u) {
      var userEnrs  = _data.enrollments.filter(function(e) { return e.user_id === u.id; });
      var enrCount  = userEnrs.length;
      var progList  = _data.progress.filter(function(p) { return p.user_id === u.id; });
      var avgPct    = progList.length > 0
        ? Math.round(progList.reduce(function(s, p) { return s + (p.progress_pct||0); }, 0) / progList.length) : 0;
      return '<tr>' +
        '<td><strong>' + escHtml(u.name || '—') + '</strong></td>' +
        '<td style="color:var(--text-hint);font-size:13px;">' + escHtml(u.email || '—') + '</td>' +
        '<td>' + escHtml(u.phone || '—') + '</td>' +
        '<td>' + escHtml(u.company || '—') + '</td>' +
        '<td>' + escHtml(u.department || '—') + '</td>' +
        '<td><span class="badge badge-blue">' + enrCount + '개</span></td>' +
        '<td style="font-size:13px;">' + avgPct + '%</td>' +
        '<td style="font-size:12px;color:var(--text-hint);">' + formatDate(u.created_at) + '</td>' +
      '</tr>';
    }).join('');

    return '<div class="admin-card">' +
      '<div class="admin-card-header">' +
        '<span class="admin-card-title">전체 수강생 (' + list.length + '명)</span>' +
        '<input type="text" placeholder="이름·회사·연락처 검색" value="' + (search||'') + '" ' +
          'oninput="_userSearch=this.value;renderTab(\'users\')" ' +
          'style="padding:6px 12px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:var(--font);width:200px;">' +
      '</div>' +
      '<table class="admin-table">' +
        '<thead><tr><th>이름</th><th>이메일</th><th>연락처</th><th>회사명</th><th>소속/부서</th><th>수강</th><th>평균진도</th><th>가입일</th></tr></thead>' +
        '<tbody>' + (rows || '<tr class="empty-row"><td colspan="8">검색 결과가 없습니다</td></tr>') + '</tbody>' +
      '</table>' +
    '</div>';
  }

  /* ── 수강 현황 ── */
  function renderEnrollments(search) {
    var list = _data.enrollments;
    if (search) {
      var q = search.toLowerCase();
      list = list.filter(function(e) {
        var user   = _data.users.find(function(u) { return u.id === e.user_id; });
        var course = COURSES.find(function(c) { return c.id === e.course_id; });
        return (user && user.name && user.name.toLowerCase().includes(q)) ||
               (course && course.title.toLowerCase().includes(q));
      });
    }

    var rows = list.map(function(e) {
      var user   = _data.users.find(function(u) { return u.id === e.user_id; });
      var course = COURSES.find(function(c) { return c.id === e.course_id; });
      var prog   = _data.progress.find(function(p) { return p.user_id === e.user_id && p.course_id === e.course_id; });
      var pct    = prog ? prog.progress_pct : 0;
      var isDone = pct >= 100;
      return '<tr>' +
        '<td><strong>' + (user ? (user.name || '—') : '—') + '</strong></td>' +
        '<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + (course?course.title:'') + '">' + (course ? course.title : '강의 #' + e.course_id) + '</td>' +
        '<td><span class="badge ' + (isDone ? 'badge-green' : 'badge-blue') + '">' + (isDone ? '✅ 완료' : '수강중') + '</span></td>' +
        '<td>' +
          '<div style="display:flex;align-items:center;gap:8px;">' +
            '<div style="flex:1;height:6px;background:#F3F4F6;border-radius:3px;overflow:hidden;min-width:80px;">' +
              '<div style="height:100%;background:' + (isDone?'#10B981':'var(--navy)') + ';width:' + pct + '%;"></div>' +
            '</div>' +
            '<span style="font-size:12px;font-weight:700;min-width:32px;">' + pct + '%</span>' +
          '</div>' +
        '</td>' +
        '<td style="font-size:12px;color:var(--text-hint);">' + formatDate(e.enrolled_at) + '</td>' +
      '</tr>';
    }).join('');

    return '<div class="admin-card">' +
      '<div class="admin-card-header">' +
        '<span class="admin-card-title">전체 수강 현황 (' + list.length + '건)</span>' +
        '<input type="text" placeholder="수강생·강의명 검색" value="' + (search||'') + '" ' +
          'oninput="_enrollSearch=this.value;renderTab(\'enrollments\')" ' +
          'style="padding:6px 12px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:var(--font);width:200px;">' +
      '</div>' +
      '<table class="admin-table">' +
        '<thead><tr><th>수강생</th><th>강의</th><th>상태</th><th>진도율</th><th>신청일</th></tr></thead>' +
        '<tbody>' + (rows || '<tr class="empty-row"><td colspan="5">검색 결과가 없습니다</td></tr>') + '</tbody>' +
      '</table>' +
    '</div>';
  }


  /* ══════════════════════════════════════
     FAQ 관리
  ══════════════════════════════════════ */
  var FAQ_CATS = ['일반','수강','기술지원','기타'];

  async function renderFAQTab() {
    var el = document.getElementById('adminContent');
    var list = _data.faqs;
    var rows = list.length === 0
      ? '<tr class="empty-row"><td colspan="5">등록된 FAQ가 없습니다. 위 버튼으로 추가하세요.</td></tr>'
      : list.map(function(f) {
          return '<tr>' +
            '<td><span class="badge badge-blue">' + f.category + '</span></td>' +
            '<td style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + escHtml(f.question) + '">' + escHtml(f.question) + '</td>' +
            '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-hint);font-size:13px;" title="' + escHtml(f.answer) + '">' + escHtml(f.answer) + '</td>' +
            '<td>' + (f.is_published ? '<span class="badge badge-green">공개</span>' : '<span class="badge badge-gray">비공개</span>') + '</td>' +
            '<td>' +
              '<button onclick="openFAQModal(' + f.id + ')" style="' + btnStyle('#EFF6FF','#2563EB') + '">수정</button> ' +
              '<button onclick="deleteFAQ(' + f.id + ')" style="' + btnStyle('#FEF2F2','#DC2626') + '">삭제</button>' +
            '</td>' +
          '</tr>';
        }).join('');

    el.innerHTML =
      '<div class="admin-card">' +
        '<div class="admin-card-header">' +
          '<span class="admin-card-title">FAQ 목록 (' + list.length + '개)</span>' +
          '<button onclick="openFAQModal(null)" style="padding:8px 16px;background:var(--navy);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);">+ FAQ 추가</button>' +
        '</div>' +
        '<table class="admin-table">' +
          '<thead><tr><th>카테고리</th><th>질문</th><th>답변 미리보기</th><th>상태</th><th>작업</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
      '</div>';
  }

  function openFAQModal(id) {
    var faq = id ? _data.faqs.find(function(f) { return f.id === id; }) : null;
    var modal = document.getElementById('faqModal');
    document.getElementById('faqModalTitle').textContent = faq ? 'FAQ 수정' : 'FAQ 추가';
    document.getElementById('faqId').value = faq ? faq.id : '';
    document.getElementById('faqCategory').value = faq ? faq.category : '일반';
    document.getElementById('faqQuestion').value = faq ? faq.question : '';
    document.getElementById('faqAnswer').value = faq ? faq.answer : '';
    document.getElementById('faqPublished').checked = faq ? faq.is_published : true;
    modal.style.display = 'flex';
  }

  function closeFAQModal() {
    document.getElementById('faqModal').style.display = 'none';
  }

  async function saveFAQ() {
    var id       = document.getElementById('faqId').value;
    var category = document.getElementById('faqCategory').value.trim();
    var question = document.getElementById('faqQuestion').value.trim();
    var answer   = document.getElementById('faqAnswer').value.trim();
    var pub      = document.getElementById('faqPublished').checked;
    if (!question || !answer) { showToast('질문과 답변을 입력해주세요'); return; }

    var payload = { category: category, question: question, answer: answer, is_published: pub, updated_at: new Date().toISOString() };
    var res;
    if (id) {
      res = await _supabase.from('faqs').update(payload).eq('id', parseInt(id));
    } else {
      payload.order_num = _data.faqs.length;
      res = await _supabase.from('faqs').insert(payload);
    }

    if (res.error) { showToast('저장 실패: ' + res.error.message); return; }
    showToast(id ? 'FAQ가 수정되었습니다' : 'FAQ가 등록되었습니다');
    closeFAQModal();
    var fqRes = await _supabase.from('faqs').select('*').order('order_num').order('created_at');
    _data.faqs = fqRes.data || [];
    renderFAQTab();
  }

  async function deleteFAQ(id) {
    if (!confirm('이 FAQ를 삭제하시겠습니까?')) return;
    var res = await _supabase.from('faqs').delete().eq('id', id);
    if (res.error) { showToast('삭제 실패: ' + res.error.message); return; }
    showToast('FAQ가 삭제되었습니다');
    _data.faqs = _data.faqs.filter(function(f) { return f.id !== id; });
    renderFAQTab();
  }

  /* ══════════════════════════════════════
     커뮤니티 관리
  ══════════════════════════════════════ */
  var _commTab = 'posts';
  var POST_CAT_MAP = { notice:'공지', qa:'Q&A', review:'후기', free:'자유' };

  async function renderCommunityTab() {
    var el = document.getElementById('adminContent');
    el.innerHTML =
      '<div class="admin-card">' +
        '<div class="tab-row">' +
          '<button class="tab-btn' + (_commTab==='posts'?' active':'') + '" onclick="_commTab=\'posts\';renderCommunityTab()">게시글 (' + _data.posts.length + ')</button>' +
          '<button class="tab-btn' + (_commTab==='comments'?' active':'') + '" onclick="_commTab=\'comments\';renderCommunityTab()">댓글 (' + _data.comments.length + ')</button>' +
        '</div>' +
        '<div id="commTabContent"></div>' +
      '</div>';

    if (_commTab === 'posts') renderPostsPanel();
    else renderCommentsPanel();
  }

  function renderPostsPanel() {
    var rows = _data.posts.length === 0
      ? '<tr class="empty-row"><td colspan="6">게시글이 없습니다</td></tr>'
      : _data.posts.map(function(p) {
          var catLabel = POST_CAT_MAP[p.category] || p.category;
          var badges = (p.is_pinned ? '<span class="badge badge-gold" style="margin-right:2px;">📌고정</span>' : '') +
                       (p.is_hidden ? '<span class="badge badge-gray">숨김</span>' : '<span class="badge badge-green">공개</span>');
          return '<tr>' +
            '<td><span class="badge badge-blue">' + catLabel + '</span></td>' +
            '<td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(p.title) + '</td>' +
            '<td>' + escHtml(p.author_name) + '</td>' +
            '<td style="text-align:center;">' + _data.comments.filter(function(c){return c.post_id===p.id;}).length + '</td>' +
            '<td>' + badges + '</td>' +
            '<td style="white-space:nowrap;">' +
              '<button onclick="pinPost(' + p.id + ',' + (!p.is_pinned) + ')" style="' + btnStyle('#FFFBEB','#D97706') + '">' + (p.is_pinned?'고정해제':'고정') + '</button> ' +
              '<button onclick="hidePost(' + p.id + ',' + (!p.is_hidden) + ')" style="' + btnStyle('#F3F4F6','#374151') + '">' + (p.is_hidden?'공개':'숨김') + '</button> ' +
              '<button onclick="deletePost(' + p.id + ')" style="' + btnStyle('#FEF2F2','#DC2626') + '">삭제</button>' +
            '</td>' +
          '</tr>';
        }).join('');

    document.getElementById('commTabContent').innerHTML =
      '<div style="padding:16px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:flex-end;">' +
        '<button onclick="openCommentWriteModal(null)" style="padding:8px 16px;background:var(--navy);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);">+ 관리자 댓글 작성</button>' +
      '</div>' +
      '<table class="admin-table">' +
        '<thead><tr><th>유형</th><th>제목</th><th>작성자</th><th>댓글</th><th>상태</th><th>작업</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>';
  }

  function renderCommentsPanel() {
    var rows = _data.comments.length === 0
      ? '<tr class="empty-row"><td colspan="4">댓글이 없습니다</td></tr>'
      : _data.comments.map(function(c) {
          var post = _data.posts.find(function(p){return p.id===c.post_id;});
          return '<tr>' +
            '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--text-hint);">' + (post ? escHtml(post.title) : '#' + c.post_id) + '</td>' +
            '<td>' + escHtml(c.author_name) + '</td>' +
            '<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escHtml(c.content) + '</td>' +
            '<td><button onclick="deleteComment(' + c.id + ')" style="' + btnStyle('#FEF2F2','#DC2626') + '">삭제</button></td>' +
          '</tr>';
        }).join('');

    document.getElementById('commTabContent').innerHTML =
      '<table class="admin-table">' +
        '<thead><tr><th>게시글</th><th>작성자</th><th>댓글 내용</th><th>작업</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>';
  }

  async function pinPost(id, val) {
    var res = await _supabase.from('community_posts').update({ is_pinned: val }).eq('id', id);
    if (res.error) { showToast('오류: ' + res.error.message); return; }
    var p = _data.posts.find(function(p){return p.id===id;}); if (p) p.is_pinned = val;
    showToast(val ? '게시글이 고정되었습니다' : '고정이 해제되었습니다');
    renderCommunityTab();
  }

  async function hidePost(id, val) {
    var res = await _supabase.from('community_posts').update({ is_hidden: val }).eq('id', id);
    if (res.error) { showToast('오류: ' + res.error.message); return; }
    var p = _data.posts.find(function(p){return p.id===id;}); if (p) p.is_hidden = val;
    showToast(val ? '게시글이 숨김 처리되었습니다' : '게시글이 공개되었습니다');
    renderCommunityTab();
  }

  async function deletePost(id) {
    if (!confirm('이 게시글과 모든 댓글을 삭제하시겠습니까?')) return;
    var res = await _supabase.from('community_posts').delete().eq('id', id);
    if (res.error) { showToast('삭제 실패: ' + res.error.message); return; }
    _data.posts    = _data.posts.filter(function(p){return p.id!==id;});
    _data.comments = _data.comments.filter(function(c){return c.post_id!==id;});
    showToast('게시글이 삭제되었습니다');
    renderCommunityTab();
  }

  async function deleteComment(id) {
    if (!confirm('이 댓글을 삭제하시겠습니까?')) return;
    var res = await _supabase.from('community_comments').delete().eq('id', id);
    if (res.error) { showToast('삭제 실패: ' + res.error.message); return; }
    _data.comments = _data.comments.filter(function(c){return c.id!==id;});
    showToast('댓글이 삭제되었습니다');
    renderCommunityTab();
  }

  /* ── 관리자 댓글 작성 모달 ── */
  function openCommentWriteModal(postId) {
    var modal = document.getElementById('commentModal');
    var sel = document.getElementById('commentPostSelect');
    sel.innerHTML = _data.posts.map(function(p) {
      return '<option value="' + p.id + '"' + (postId===p.id?' selected':'') + '>' + escHtml(p.title.slice(0,40)) + '</option>';
    }).join('');
    document.getElementById('commentContent').value = '';
    modal.style.display = 'flex';
  }

  function closeCommentModal() {
    document.getElementById('commentModal').style.display = 'none';
  }

  async function saveComment() {
    var postId  = parseInt(document.getElementById('commentPostSelect').value);
    var content = document.getElementById('commentContent').value.trim();
    if (!content) { showToast('댓글 내용을 입력해주세요'); return; }

    var { data: { session } } = await _supabase.auth.getSession();
    var res = await _supabase.from('community_comments').insert({
      post_id: postId, author_id: session.user.id,
      author_name: '운영팀', content: content
    });
    if (res.error) { showToast('등록 실패: ' + res.error.message); return; }
    showToast('댓글이 등록되었습니다');
    closeCommentModal();
    var cmRes = await _supabase.from('community_comments').select('*').order('created_at', { ascending: false });
    _data.comments = cmRes.data || [];
    renderCommunityTab();
  }

  /* ── 공통 헬퍼 ── */
  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function btnStyle(bg, color) {
    return 'padding:4px 10px;background:' + bg + ';color:' + color + ';border:none;border-radius:4px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);';
  }

  /* ── 초기화 ── */
  async function init() {
    var { data: { session } } = await _supabase.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    /* 관리자 권한 체크 */
    if (!ADMIN_EMAILS.includes(session.user.email)) {
      alert('관리자 권한이 없습니다.');
      window.location.href = 'index.html';
      return;
    }

    document.getElementById('adminEmail').textContent = session.user.email;
    document.getElementById('sidebarEmail').textContent = session.user.email;

    await loadAll();

    /* URL hash로 초기 탭 결정 */
    var hash = window.location.hash.replace('#', '');
    var validTabs = ['dashboard','users','enrollments','faq','community'];
    var initTab = validTabs.includes(hash) ? hash : 'dashboard';
    showTab(initTab);
  }

  init();
</script>
</body>
</html>
