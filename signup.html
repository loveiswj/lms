<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 — 비아이매트릭스 아카데미</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }

    .input-focus-premium:focus {
      outline: none;
      border-color: #2563EB !important;
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.15);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }

    /* 비표준 Tailwind 크기 보정 */
    .w-5-5 { width: 1.375rem; }
    .h-5-5 { height: 1.375rem; }
    .w-4-5 { width: 1.125rem; }
    .h-4-5 { height: 1.125rem; }

    /* Toast */
    .toast {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1A1A2E; color: #fff;
      padding: 12px 24px; border-radius: 8px;
      font-size: 14px; opacity: 0; transition: all 0.3s;
      z-index: 9999; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 약관 모달 */
    .terms-modal-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 9999;
      align-items: center; justify-content: center;
    }
    .terms-modal-bg.open { display: flex; }
    .terms-modal {
      background: #fff; border-radius: 12px;
      width: 90%; max-width: 520px; max-height: 80vh;
      display: flex; flex-direction: column;
      box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    }
    .terms-modal__head {
      padding: 20px 24px 16px; border-bottom: 1px solid #E2E8F0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .terms-modal__title { font-size: 16px; font-weight: 700; color: #0f2042; }
    .terms-modal__close {
      background: none; border: none; cursor: pointer;
      font-size: 20px; color: #9CA3AF; line-height: 1;
    }
    .terms-modal__body {
      padding: 20px 24px; overflow-y: auto;
      font-size: 13px; line-height: 1.8; color: #6B7280;
    }
    .terms-modal__body h4 { font-size: 13px; font-weight: 700; color: #0f2042; margin: 16px 0 6px; }
    .terms-modal__foot { padding: 16px 24px; border-top: 1px solid #E2E8F0; text-align: right; }
    .terms-modal__foot button {
      padding: 10px 28px; background: #0f2042; color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-8 px-4"
      style="background-color:#F4F6F9; background-image:radial-gradient(circle at top right, rgba(15,32,66,0.05) 0%, transparent 50%);">

  <div class="w-full max-w-[480px] bg-white border border-[#E2E8F0] rounded-2xl p-8 shadow-xl transition-all duration-300">

    <!-- 헤더 -->
    <div class="text-center mb-6">
      <div class="flex items-center justify-center mb-3">
        <a href="index.html">
          <img src="assets/images/bimatrix_logo.png" alt="BI MATRIX" class="h-9 object-contain"
               onerror="this.style.display='none'; document.getElementById('logoFallback').classList.remove('hidden');">
        </a>
        <span id="logoFallback" class="text-2xl font-black tracking-tight text-[#0f2042] hidden">
          <span class="text-red-600 font-extrabold italic">BI</span> MATRIX
        </span>
      </div>
      <h1 class="text-2xl font-bold text-[#1E293B] tracking-tight">회원가입</h1>
      <p class="text-xs text-gray-500 mt-1.5">가입 후 커뮤니티에서 자유롭게 글을 작성해 보세요</p>
    </div>

    <form id="signupForm" class="space-y-4" onsubmit="handleSubmit(event)" novalidate>

      <!-- 이름 & 연락처 -->
      <div class="grid grid-cols-2 gap-3.5">
        <div>
          <label for="name" class="block text-xs font-bold text-gray-700 mb-1.5">이름 <span class="text-red-500">*</span></label>
          <input type="text" id="name" name="name" placeholder="홍길동" autocomplete="name"
                 class="input-focus-premium w-full px-3.5 py-3 bg-white border border-[#CBD5E1] rounded-lg text-sm text-gray-800 placeholder-gray-400 transition-all duration-200"
                 onblur="validateName()">
          <p id="nameError" class="text-[11px] text-red-500 mt-1 hidden"></p>
        </div>
        <div>
          <label for="phone" class="block text-xs font-bold text-gray-700 mb-1.5">연락처 <span class="text-red-500">*</span></label>
          <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" maxlength="13"
                 autocomplete="tel" inputmode="numeric"
                 class="input-focus-premium w-full px-3.5 py-3 bg-white border border-[#CBD5E1] rounded-lg text-sm text-gray-800 placeholder-gray-400 transition-all duration-200"
                 oninput="handlePhoneInput(this)" onblur="validatePhone()">
          <p id="phoneError" class="text-[11px] text-red-500 mt-1 hidden"></p>
        </div>
      </div>

      <!-- 회사명 & 부서명 -->
      <div class="grid grid-cols-2 gap-3.5">
        <div>
          <label for="company" class="block text-xs font-bold text-gray-700 mb-1.5">회사명 <span class="text-red-500">*</span></label>
          <input type="text" id="company" name="company" placeholder="(주)회사명" autocomplete="organization"
                 class="input-focus-premium w-full px-3.5 py-3 bg-white border border-[#CBD5E1] rounded-lg text-sm text-gray-800 placeholder-gray-400 transition-all duration-200"
                 onblur="validateCompany()">
          <p id="companyError" class="text-[11px] text-red-500 mt-1 hidden"></p>
        </div>
        <div>
          <label for="department" class="block text-xs font-bold text-gray-700 mb-1.5">
            부서명 <span class="text-gray-400 text-[10px] font-normal">(선택)</span>
          </label>
          <input type="text" id="department" name="department" placeholder="영업팀"
                 class="input-focus-premium w-full px-3.5 py-3 bg-white border border-[#CBD5E1] rounded-lg text-sm text-gray-800 placeholder-gray-400 transition-all duration-200">
        </div>
      </div>

      <!-- 이메일 -->
      <div>
        <label for="email" class="block text-xs font-bold text-gray-700 mb-1.5">이메일 <span class="text-red-500">*</span></label>
        <input type="email" id="email" name="email" placeholder="이메일 주소를 입력하세요" autocomplete="email"
               class="input-focus-premium w-full px-4 py-3 bg-white border border-[#CBD5E1] rounded-lg text-sm text-gray-800 placeholder-gray-400 transition-all duration-200"
               onblur="validateEmail()">
        <p id="emailError" class="text-[11px] text-red-500 mt-1 hidden"></p>
      </div>

      <!-- 비밀번호 -->
      <div>
        <label for="password" class="block text-xs font-bold text-gray-700 mb-1.5">비밀번호 <span class="text-red-500">*</span></label>
        <input type="password" id="password" name="password" placeholder="영문·숫자 조합 8자 이상" autocomplete="new-password"
               class="input-focus-premium w-full px-4 py-3 bg-white border border-[#CBD5E1] rounded-lg text-sm text-gray-800 placeholder-gray-400 transition-all duration-200"
               oninput="validatePassword()">
        <div class="flex items-center gap-1.5 mt-2">
          <span id="pwdConditionIcon" class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-gray-100 text-gray-400 transition-all duration-200">
            <svg class="w-2.5 h-2.5 fill-current" viewBox="0 0 20 20"><path d="M0 11l2-2 5 5L18 3l2 2L7 18z"/></svg>
          </span>
          <span id="pwdConditionText" class="text-[11px] text-gray-400 transition-all duration-200">영문·숫자 조합 8자 이상</span>
        </div>
        <p id="passwordError" class="text-[11px] text-red-500 mt-1 hidden"></p>
      </div>

      <!-- 비밀번호 확인 -->
      <div>
        <label for="passwordConfirm" class="block text-xs font-bold text-gray-700 mb-1.5">비밀번호 확인 <span class="text-red-500">*</span></label>
        <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password"
               class="input-focus-premium w-full px-4 py-3 bg-white border border-[#CBD5E1] rounded-lg text-sm text-gray-800 placeholder-gray-400 transition-all duration-200"
               oninput="validatePasswordConfirm()">
        <p id="passwordConfirmError" class="text-[11px] text-red-500 mt-1 hidden"></p>
      </div>

      <!-- 약관 동의 -->
      <div class="border border-[#E2E8F0] rounded-xl overflow-hidden bg-[#F8FAFC] p-4 space-y-3" id="agreeBox">

        <!-- 전체 동의 -->
        <div class="flex items-center justify-between pb-2.5 border-b border-[#E2E8F0]">
          <label class="flex items-start gap-2.5 cursor-pointer select-none">
            <input type="checkbox" id="agreeAll" class="sr-only" onchange="toggleAllAgreements(this)">
            <div id="agreeAllBox" class="w-5-5 h-5-5 rounded-full border border-[#CBD5E1] flex items-center justify-center transition-all bg-white flex-shrink-0 mt-0.5">
              <svg class="w-3 h-3 text-gray-300 fill-current" viewBox="0 0 20 20"><path d="M0 11l2-2 5 5L18 3l2 2L7 18z"/></svg>
            </div>
            <div class="flex flex-col">
              <span class="text-sm font-bold text-[#1E293B] leading-none mt-0.5">전체 동의하기</span>
              <span class="text-[10px] text-gray-400 mt-1.5 leading-tight">이용약관 및 개인정보 수집(필수), 마케팅 동의 포함</span>
            </div>
          </label>
        </div>

        <!-- 개별 약관 -->
        <div class="space-y-2.5 pt-0.5">

          <!-- 이용약관 -->
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2.5 cursor-pointer select-none">
              <input type="checkbox" id="agreeTerms" name="agreement" class="sr-only" onchange="handleIndividualAgreement()">
              <div class="check-box-circle w-4-5 h-4-5 rounded-full border border-[#CBD5E1] flex items-center justify-center transition-all bg-white flex-shrink-0">
                <svg class="w-2.5 h-2.5 text-gray-300 fill-current" viewBox="0 0 20 20"><path d="M0 11l2-2 5 5L18 3l2 2L7 18z"/></svg>
              </div>
              <span class="text-xs text-gray-600"><span class="text-[#0f2042] font-bold">[필수]</span> 이용약관 동의</span>
            </label>
            <a href="#" class="text-[11px] text-gray-400 underline hover:text-gray-600"
               onclick="event.preventDefault(); openTerms('terms')">보기</a>
          </div>

          <!-- 개인정보 처리방침 -->
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2.5 cursor-pointer select-none">
              <input type="checkbox" id="agreePrivacy" name="agreement" class="sr-only" onchange="handleIndividualAgreement()">
              <div class="check-box-circle w-4-5 h-4-5 rounded-full border border-[#CBD5E1] flex items-center justify-center transition-all bg-white flex-shrink-0">
                <svg class="w-2.5 h-2.5 text-gray-300 fill-current" viewBox="0 0 20 20"><path d="M0 11l2-2 5 5L18 3l2 2L7 18z"/></svg>
              </div>
              <span class="text-xs text-gray-600"><span class="text-[#0f2042] font-bold">[필수]</span> 개인정보 처리방침 동의</span>
            </label>
            <a href="#" class="text-[11px] text-gray-400 underline hover:text-gray-600"
               onclick="event.preventDefault(); openTerms('privacy')">보기</a>
          </div>

          <!-- 마케팅 수신 동의 -->
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2.5 cursor-pointer select-none">
              <input type="checkbox" id="agreeMarketing" name="agreement" class="sr-only" onchange="handleIndividualAgreement()">
              <div class="check-box-circle w-4-5 h-4-5 rounded-full border border-[#CBD5E1] flex items-center justify-center transition-all bg-white flex-shrink-0">
                <svg class="w-2.5 h-2.5 text-gray-300 fill-current" viewBox="0 0 20 20"><path d="M0 11l2-2 5 5L18 3l2 2L7 18z"/></svg>
              </div>
              <span class="text-xs text-gray-500"><span class="text-gray-400 font-medium">[선택]</span> 마케팅 정보 수신 동의</span>
            </label>
            <a href="#" class="text-[11px] text-gray-400 underline hover:text-gray-600"
               onclick="event.preventDefault(); openTerms('marketing')">보기</a>
          </div>
        </div>

        <p id="agreementError" class="text-[11px] text-red-500 hidden"></p>
      </div>

      <!-- 제출 버튼 -->
      <button type="submit" id="signupBtn"
              class="w-full bg-[#0f2042] hover:bg-[#183266] hover:shadow-lg hover:shadow-blue-900/10 text-white font-bold py-3.5 rounded-lg transition-all duration-300 text-sm mt-3 focus:ring-4 focus:ring-blue-100">
        동의하고 가입하기
      </button>
    </form>

    <div class="text-center mt-5 text-xs text-gray-500">
      이미 계정이 있으신가요?
      <a href="login.html" class="text-[#0f2042] font-semibold hover:underline ml-1">로그인</a>
    </div>
  </div>

  <!-- Toast (에러 알림) -->
  <div class="toast" id="toast"></div>

  <!-- 가입 완료 모달 -->
  <div id="successModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white border border-[#E2E8F0] p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl transform scale-95 transition-transform duration-300">
      <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-7 h-7 fill-current" viewBox="0 0 20 20"><path d="M0 11l2-2 5 5L18 3l2 2L7 18z"/></svg>
      </div>
      <h2 class="text-lg font-bold text-[#1E293B] mb-2">가입 신청 완료</h2>
      <p id="modalUserMessage" class="text-xs text-gray-500 leading-relaxed mb-6"></p>
      <button onclick="closeSuccessModal()"
              class="w-full bg-[#0f2042] text-white font-bold py-3 rounded-lg hover:bg-[#183266] transition-colors">
        확인
      </button>
    </div>
  </div>

  <!-- 이용약관 모달 -->
  <div class="terms-modal-bg" id="termsModal">
    <div class="terms-modal">
      <div class="terms-modal__head">
        <span class="terms-modal__title" id="termsModalTitle">이용약관</span>
        <button class="terms-modal__close" onclick="closeTerms()">✕</button>
      </div>
      <div class="terms-modal__body" id="termsModalBody"></div>
      <div class="terms-modal__foot">
        <button onclick="agreeAndClose()">동의하고 닫기</button>
      </div>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script>
    /* ── 약관 내용 ── */
    var _currentTermsId = null;
    var TERMS_CONTENT = {
      terms: {
        title: '이용약관',
        targetId: 'agreeTerms',
        body: '<h4>제1조 (목적)</h4>본 약관은 비아이매트릭스 아카데미(이하 "회사")가 제공하는 교육 서비스의 이용 조건 및 절차에 관한 사항을 규정함을 목적으로 합니다.' +
              '<h4>제2조 (서비스 이용)</h4>회원은 회사가 제공하는 강의 콘텐츠를 개인 학습 목적으로만 이용할 수 있으며, 무단 배포·재판매·공유를 금지합니다.' +
              '<h4>제3조 (계정 관리)</h4>회원은 본인의 계정 정보를 안전하게 관리할 책임이 있으며, 타인에게 계정을 양도하거나 공유할 수 없습니다.' +
              '<h4>제4조 (서비스 변경 및 중단)</h4>회사는 운영상 필요에 따라 서비스 내용을 변경하거나 중단할 수 있으며, 이 경우 사전에 공지합니다.' +
              '<h4>제5조 (면책)</h4>회사는 천재지변, 시스템 장애 등 불가피한 사유로 인한 서비스 중단에 대해 책임을 지지 않습니다.'
      },
      privacy: {
        title: '개인정보 처리방침',
        targetId: 'agreePrivacy',
        body: '<p style="margin-bottom:12px;">비아이매트릭스㈜(이하 \'회사\'라 한다)는 정보주체의 자유와 권리 보호를 위해 「개인정보 보호법」 및 관계 법령이 정한 바를 준수하여, 적법하게 개인정보를 처리하고 안전하게 관리하고 있습니다.</p>' +
              '<h4>제1조 개인정보의 처리 목적과 항목</h4>' +
              '<p>회사는 다음의 목적을 위하여 개인정보를 처리합니다.</p>' +
              '<p><b>1) 문의 사항</b><br>필수: 문의 경로/유형, 요청 사항, 회사명, 부서명, 성함, 이메일 주소, 휴대전화 번호, 제목, 내용<br>목적: 고객 문의에 대한 답변 제공 및 현황 관리</p>' +
              '<p><b>2) 뉴스레터 및 마케팅 활용</b><br>필수: 회사명, 성함, 이메일 주소 / 선택: 연락처, 부서명, 직급, 관심사<br>목적: 뉴스레터 제공, 신규 서비스/제품 홍보 및 이벤트 등 정보 전달</p>' +
              '<p><b>3) 교육 신청</b><br>필수: 회사명, 이름, 이메일 주소, 휴대전화 번호<br>목적: 교육 신청자 기본 정보 수집</p>' +
              '<p><b>4) 채용</b><br>필수: 이름, 이메일 주소, 휴대전화 번호, 학력, 경력사항, 주소, 자격사항<br>목적: 채용 프로세스 진행</p>' +
              '<p><b>5) 자동 수집 항목</b><br>수집: IP 주소, 쿠키, 방문 기록, 서비스 이용 기록<br>목적: 웹사이트 이용 통계 분석 및 서비스 최적화</p>' +
              '<p>이용자는 필수 정보 수집에 대한 동의를 거부할 권리가 있으며, 동의를 하지 않을 경우 관련 서비스가 제한될 수 있습니다.</p>' +
              '<h4>제2조 개인정보의 처리 및 보유 기간</h4>' +
              '<p>개인정보는 정보 제공일로부터 서비스를 제공하는 기간 동안 보유·이용됩니다. 본인 정보 삭제를 요청하거나 개인정보 수집 및 이용목적이 달성된 후에는 예외 없이 해당 정보를 지체 없이 파기합니다. 단, 입사 지원으로 인한 개인정보 수집은 입사 지원 제출일로부터 1년간 보유 후 파기됩니다.</p>' +
              '<h4>제3조 개인정보의 파기 절차 및 방법</h4>' +
              '<p>회사는 개인정보가 불필요하게 되었을 때에는 지체없이 해당 개인정보를 파기합니다.</p>' +
              '<p><b>파기절차:</b> 파기 사유가 발생한 개인정보를 선정하고, 개인정보 보호책임자의 승인을 받아 1개월 내에 파기합니다.</p>' +

    /* ── 유효성 검사 공통 토글러 ── */
    function toggleErrorUI(inputId, errorId, errorMsg, isValid) {
      var inputEl = document.getElementById(inputId);
      var errorEl = document.getElementById(errorId);
      if (isValid) {
        inputEl.classList.remove('border-red-500');
        inputEl.classList.add('border-[#CBD5E1]');
        errorEl.classList.add('hidden');
        errorEl.innerText = '';
      } else {
        inputEl.classList.remove('border-[#CBD5E1]');
        inputEl.classList.add('border-red-500');
        errorEl.classList.remove('hidden');
        errorEl.innerText = errorMsg;
      }
    }

    function validateName() {
      var isValid = document.getElementById('name').value.trim().length > 0;
      toggleErrorUI('name', 'nameError', '이름을 입력해 주세요.', isValid);
      return isValid;
    }

    function handlePhoneInput(input) {
      var digits = input.value.replace(/\D/g, '').slice(0, 11);
      if (digits.length > 7) {
        input.value = digits.slice(0,3) + '-' + digits.slice(3,7) + '-' + digits.slice(7);
      } else if (digits.length > 3) {
        input.value = digits.slice(0,3) + '-' + digits.slice(3);
      } else {
        input.value = digits;
      }
    }

    function validatePhone() {
      var val = document.getElementById('phone').value.trim();
      if (!val) {
        toggleErrorUI('phone', 'phoneError', '연락처를 입력해 주세요.', false);
        return false;
      }
      var isValid = /^\d{3}-\d{4}-\d{4}$/.test(val);
      toggleErrorUI('phone', 'phoneError', '올바른 형식이 아닙니다. (예: 010-0000-0000)', isValid);
      return isValid;
    }

    function validateCompany() {
      var isValid = document.getElementById('company').value.trim().length > 0;
      toggleErrorUI('company', 'companyError', '회사명을 입력해 주세요.', isValid);
      return isValid;
    }

    function validateEmail() {
      var val = document.getElementById('email').value.trim();
      if (!val) {
        toggleErrorUI('email', 'emailError', '이메일 주소를 입력해 주세요.', false);
        return false;
      }
      var isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
      toggleErrorUI('email', 'emailError', '올바른 이메일 형식이 아닙니다.', isValid);
      return isValid;
    }

    function validatePassword() {
      var val = document.getElementById('password').value;
      var isValid = /[a-zA-Z]/.test(val) && /[0-9]/.test(val) && val.length >= 8;
      var icon = document.getElementById('pwdConditionIcon');
      var text = document.getElementById('pwdConditionText');
      if (isValid) {
        icon.className = 'inline-flex items-center justify-center w-4 h-4 rounded-full bg-blue-50 text-blue-600 transition-all duration-200';
        text.className = 'text-[11px] text-blue-600 font-medium transition-all duration-200';
        toggleErrorUI('password', 'passwordError', '', true);
      } else if (val.length > 0) {
        icon.className = 'inline-flex items-center justify-center w-4 h-4 rounded-full bg-red-50 text-red-400 transition-all duration-200';
        text.className = 'text-[11px] text-red-500 transition-all duration-200';
      }
      if (document.getElementById('passwordConfirm').value.length > 0) {
        validatePasswordConfirm();
      }
      return isValid;
    }

    function validatePasswordConfirm() {
      var pwd = document.getElementById('password').value;
      var confirm = document.getElementById('passwordConfirm').value;
      var isValid = pwd === confirm && confirm.length > 0;
      toggleErrorUI('passwordConfirm', 'passwordConfirmError', '비밀번호가 일치하지 않습니다.', isValid);
      return isValid;
    }

    /* ── 원형 체크박스 스타일 ── */
    function updateCheckboxStyle(boxEl, cb) {
      var svg = boxEl.querySelector('svg');
      if (cb.checked) {
        boxEl.classList.remove('border-[#CBD5E1]', 'bg-white');
        boxEl.classList.add('border-[#0f2042]', 'bg-[#0f2042]');
        svg.classList.remove('text-gray-300');
        svg.classList.add('text-white');
      } else {
        boxEl.classList.remove('border-[#0f2042]', 'bg-[#0f2042]');
        boxEl.classList.add('border-[#CBD5E1]', 'bg-white');
        svg.classList.remove('text-white');
        svg.classList.add('text-gray-300');
      }
    }

    function toggleAllAgreements(master) {
      var individualCheckboxes = document.querySelectorAll('input[name="agreement"]');
      individualCheckboxes.forEach(function(cb) {
        cb.checked = master.checked;
        var box = cb.nextElementSibling;
        if (box) updateCheckboxStyle(box, cb);
      });
      updateCheckboxStyle(document.getElementById('agreeAllBox'), master);
    }

    function handleIndividualAgreement() {
      var individualCheckboxes = document.querySelectorAll('input[name="agreement"]');
      var master = document.getElementById('agreeAll');
      var allChecked = true;
      individualCheckboxes.forEach(function(cb) {
        if (!cb.checked) allChecked = false;
        var box = cb.nextElementSibling;
        if (box) updateCheckboxStyle(box, cb);
      });
      master.checked = allChecked;
      updateCheckboxStyle(document.getElementById('agreeAllBox'), master);
      if (document.getElementById('agreeTerms').checked && document.getElementById('agreePrivacy').checked) {
        document.getElementById('agreementError').classList.add('hidden');
        document.getElementById('agreeBox').classList.remove('border-red-300');
      }
    }

    function openTerms(type) {
      _currentTermsId = TERMS_CONTENT[type].targetId;
      document.getElementById('termsModalTitle').textContent = TERMS_CONTENT[type].title;
      document.getElementById('termsModalBody').innerHTML = TERMS_CONTENT[type].body;
      document.getElementById('termsModal').classList.add('open');
    }

    function closeTerms() {
      document.getElementById('termsModal').classList.remove('open');
      _currentTermsId = null;
    }

    function agreeAndClose() {
      if (_currentTermsId) {
        var cb = document.getElementById(_currentTermsId);
        if (cb) { cb.checked = true; updateAgreeAll(); }
      }
      closeTerms();
    }

    document.getElementById('termsModal').addEventListener('click', function(e) {
      if (e.target === this) closeTerms();
    });

    /* ── Toast ── */
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    /* ── 성공 모달 ── */
    function openSuccessModal(message) {
      var modal = document.getElementById('successModal');
      var inner = modal.querySelector('.transform');
      document.getElementById('modalUserMessage').innerText = message;
      modal.classList.remove('hidden');
      setTimeout(function() {
        modal.classList.remove('opacity-0');
        inner.classList.remove('scale-95');
        inner.classList.add('scale-100');
      }, 10);
    }

    function closeSuccessModal() {
      window.location.href = 'mypage.html';
    }

    /* ── 폼 제출 (Supabase 연동) ── */
    async function handleSubmit(event) {
      event.preventDefault();

      var isNameValid    = validateName();
      var isPhoneValid   = validatePhone();
      var isCompanyValid = validateCompany();
      var isEmailValid   = validateEmail();
      var isPwdValid     = validatePassword();
      var isPwdConfirm   = validatePasswordConfirm();

      var agreeTerms  = document.getElementById('agreeTerms').checked;
      var agreePrivacy = document.getElementById('agreePrivacy').checked;
      var isAgreed = agreeTerms && agreePrivacy;
      var agreeError = document.getElementById('agreementError');
      if (!isAgreed) {
        agreeError.innerText = '필수 약관(이용약관 및 개인정보 처리방침)에 모두 동의해 주세요.';
        agreeError.classList.remove('hidden');
        document.getElementById('agreeBox').classList.add('border-red-300');
        document.getElementById('agreeBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        agreeError.classList.add('hidden');
        document.getElementById('agreeBox').classList.remove('border-red-300');
      }

      if (!isNameValid || !isPhoneValid || !isCompanyValid || !isEmailValid || !isPwdValid || !isPwdConfirm || !isAgreed) return;

      var btn = document.getElementById('signupBtn');
      btn.disabled = true;
      btn.textContent = '가입 중...';

      var email   = document.getElementById('email').value;
      var pw      = document.getElementById('password').value;
      var name    = document.getElementById('name').value.trim();
      var phone   = document.getElementById('phone').value;
      var company = document.getElementById('company').value;
      var dept    = document.getElementById('department').value;

      var { data, error } = await _supabase.auth.signUp({
        email: email,
        password: pw,
        options: { data: { name: name } }
      });

      if (error) {
        var msg = '가입 중 오류가 발생했습니다';
        if (error.message.includes('already registered') || error.message.includes('already been registered')) {
          msg = '이미 가입된 이메일입니다. 로그인해주세요';
        } else if (error.message.includes('invalid') && error.message.includes('email')) {
          msg = '올바른 이메일 형식이 아닙니다';
        } else if (error.message.includes('Password')) {
          msg = '비밀번호는 영문·숫자 조합 8자 이상이어야 합니다';
        } else if (error.message.includes('rate limit') || error.message.includes('too many')) {
          msg = '잠시 후 다시 시도해주세요 (요청 횟수 초과)';
        } else if (error.message) {
          msg = error.message;
        }
        showToast(msg);
        btn.disabled = false;
        btn.textContent = '동의하고 가입하기';
        return;
      }

      if (data.user) {
        var profileData = { id: data.user.id, name: name };
        if (phone)   profileData.phone      = phone;
        if (company) profileData.company    = company;
        if (dept)    profileData.department = dept;
        await _supabase.from('profiles').upsert(profileData, { onConflict: 'id' });
      }

      openSuccessModal(name + '님, 반갑습니다!\n가입이 정상적으로 완료되었습니다.');
    }
  </script>
