<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — 비아이매트릭스 아카데미</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }

    .input-focus-premium:focus {
      outline: none;
      border-color: #2563EB !important;
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.15);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }

    .toast {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1A1A2E; color: #fff;
      padding: 12px 24px; border-radius: 8px;
      font-size: 14px; opacity: 0; transition: all 0.3s;
      z-index: 9999; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-8 px-4"
      style="background-color:#F4F6F9; background-image:radial-gradient(circle at top right, rgba(15,32,66,0.05) 0%, transparent 50%);">

  <div class="w-full max-w-[480px] bg-white border border-[#E2E8F0] rounded-2xl p-8 shadow-xl transition-all duration-300">

    <!-- 헤더 -->
    <div class="text-center mb-8">
      <div class="flex items-center justify-center mb-4">
        <a href="index.html">
          <img src="assets/images/bimatrix_logo.png" alt="BI MATRIX" class="h-9 object-contain"
               onerror="this.style.display='none'; document.getElementById('logoFallback').classList.remove('hidden');">
        </a>
        <span id="logoFallback" class="text-2xl font-black tracking-tight text-[#0f2042] hidden">
          <span class="text-red-600 font-extrabold italic">BI</span> MATRIX
        </span>
      </div>
      <h1 class="text-xl font-bold text-[#1E293B] tracking-tight">로그인</h1>
      <p class="text-xs text-gray-500 mt-1.5">비아이매트릭스 아카데미에 오신 것을 환영합니다</p>
    </div>

    <form id="loginForm" class="space-y-5" onsubmit="handleLoginSubmit(event)" novalidate>

      <!-- 이메일 -->
      <div>
        <label for="email" class="block text-xs font-bold text-gray-700 mb-1.5">이메일 <span class="text-red-500">*</span></label>
        <input type="email" id="email" name="email" placeholder="이메일 주소를 입력하세요" autocomplete="email"
               class="input-focus-premium w-full px-4 py-3.5 bg-white border border-[#CBD5E1] rounded-lg text-sm text-gray-800 placeholder-gray-400 transition-all duration-200"
               onblur="validateEmail()">
        <p id="emailError" class="text-[11px] text-red-500 mt-1 hidden"></p>
      </div>

      <!-- 비밀번호 -->
      <div>
        <label for="password" class="block text-xs font-bold text-gray-700 mb-1.5">비밀번호 <span class="text-red-500">*</span></label>
        <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password"
               class="input-focus-premium w-full px-4 py-3.5 bg-white border border-[#CBD5E1] rounded-lg text-sm text-gray-800 placeholder-gray-400 transition-all duration-200"
               onblur="validatePassword()">
        <p id="passwordError" class="text-[11px] text-red-500 mt-1 hidden"></p>
      </div>

      <!-- 로그인 상태 유지 & 비밀번호 찾기 -->
      <div class="flex items-center justify-between pt-1">
        <label class="flex items-center gap-2.5 cursor-pointer select-none"
               onclick="event.preventDefault(); toggleKeepLogin()">
          <input type="checkbox" id="remember" class="sr-only">
          <div id="keepLoginBox" class="w-4 h-4 rounded-full border border-[#CBD5E1] flex items-center justify-center transition-all bg-white flex-shrink-0">
            <svg class="w-2.5 h-2.5 text-gray-300 fill-current" viewBox="0 0 20 20"><path d="M0 11l2-2 5 5L18 3l2 2L7 18z"/></svg>
          </div>
          <span class="text-xs text-gray-600 font-medium">로그인 상태 유지</span>
        </label>
        <a href="#" class="text-xs text-[#0f2042] font-semibold hover:underline"
           onclick="forgotPassword(event)">비밀번호 찾기</a>
      </div>

      <!-- 로그인 버튼 -->
      <button type="submit" id="loginBtn"
              class="w-full bg-[#0f2042] hover:bg-[#183266] hover:shadow-lg hover:shadow-blue-900/10 text-white font-bold py-4 rounded-lg transition-all duration-300 text-sm mt-3 focus:ring-4 focus:ring-blue-100">
        로그인
      </button>
    </form>

    <div class="text-center mt-6 text-xs text-gray-500">
      아직 회원이 아니신가요?
      <a href="signup.html" class="text-[#0f2042] font-bold hover:underline ml-1">회원가입</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/supabase-client.js"></script>
  <script>
    /* ── returnTo 파라미터 처리 ── */
    var _returnTo = new URLSearchParams(window.location.search).get('returnTo') || 'mypage.html';

    /* ── 이미 로그인된 경우 원래 페이지로 이동 ── */
    _supabase.auth.getSession().then(function(res) {
      if (res.data.session) window.location.href = _returnTo;
    });

    /* ── 페이지 로드 시 저장된 이메일 복원 ── */
    window.addEventListener('DOMContentLoaded', function() {
      if (localStorage.getItem('keepLoggedIn') === 'true') {
        var savedEmail = localStorage.getItem('savedEmail');
        if (savedEmail) document.getElementById('email').value = savedEmail;
        var cb = document.getElementById('remember');
        cb.checked = true;
        updateKeepLoginStyle(true);
      }
    });

    /* ── Toast ── */
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    /* ── 유효성 검사 공통 토글러 ── */
    function toggleErrorUI(inputId, errorId, errorMsg, isValid) {
      var inputEl = document.getElementById(inputId);
      var errorEl = document.getElementById(errorId);
      if (isValid) {
        inputEl.classList.remove('border-red-500');
        inputEl.classList.add('border-[#CBD5E1]');
        errorEl.classList.add('hidden');
        errorEl.innerText = '';
      } else {
        inputEl.classList.remove('border-[#CBD5E1]');
        inputEl.classList.add('border-red-500');
        errorEl.classList.remove('hidden');
        errorEl.innerText = errorMsg;
      }
    }

    function validateEmail() {
      var val = document.getElementById('email').value.trim();
      if (!val) {
        toggleErrorUI('email', 'emailError', '이메일 주소를 입력해 주세요.', false);
        return false;
      }
      var isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
      toggleErrorUI('email', 'emailError', '올바른 이메일 형식이 아닙니다.', isValid);
      return isValid;
    }

    function validatePassword() {
      var val = document.getElementById('password').value;
      var isValid = val.length > 0;
      toggleErrorUI('password', 'passwordError', '비밀번호를 입력해 주세요.', isValid);
      return isValid;
    }

    /* ── 원형 체크박스 스타일 ── */
    function updateKeepLoginStyle(isChecked) {
      var box = document.getElementById('keepLoginBox');
      var svg = box.querySelector('svg');
      if (isChecked) {
        box.classList.remove('border-[#CBD5E1]', 'bg-white');
        box.classList.add('border-[#0f2042]', 'bg-[#0f2042]');
        svg.classList.remove('text-gray-300');
        svg.classList.add('text-white');
      } else {
        box.classList.remove('border-[#0f2042]', 'bg-[#0f2042]');
        box.classList.add('border-[#CBD5E1]', 'bg-white');
        svg.classList.remove('text-white');
        svg.classList.add('text-gray-300');
      }
    }

    function toggleKeepLogin() {
      var cb = document.getElementById('remember');
      cb.checked = !cb.checked;
      updateKeepLoginStyle(cb.checked);
    }

    /* ── 로그인 제출 ── */
    async function handleLoginSubmit(event) {
      event.preventDefault();

      var isEmailValid = validateEmail();
      var isPwdValid   = validatePassword();
      if (!isEmailValid || !isPwdValid) return;

      var btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = '로그인 중...';

      var email    = document.getElementById('email').value;
      var password = document.getElementById('password').value;
      var remember = document.getElementById('remember').checked;

      /* 로그인 상태 유지: 이메일 저장 */
      if (remember) {
        localStorage.setItem('keepLoggedIn', 'true');
        localStorage.setItem('savedEmail', email);
      } else {
        localStorage.removeItem('keepLoggedIn');
        localStorage.removeItem('savedEmail');
      }

      var { data, error } = await _supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        var msg = '이메일 또는 비밀번호가 올바르지 않습니다';
        if (error.message && error.message.toLowerCase().includes('email not confirmed')) {
          msg = '이메일 인증이 필요합니다. 가입 시 받은 메일을 확인해 주세요.';
        }
        showToast(msg);
        btn.disabled = false;
        btn.textContent = '로그인';
      } else if (!data.session) {
        showToast('이메일 인증 후 로그인해 주세요. 메일함을 확인해 주세요.');
        btn.disabled = false;
        btn.textContent = '로그인';
      } else {
        /* 세션 강제 저장 후 이동 */
        await _supabase.auth.setSession({
          access_token: data.session.access_token,
          refresh_token: data.session.refresh_token
        });
        window.location.href = _returnTo;
      }
    }

    /* ── 비밀번호 찾기 ── */
    async function forgotPassword(e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      if (!email || !/\S+@\S+\.\S+/.test(email)) {
        showToast('이메일 주소를 먼저 입력해주세요');
        document.getElementById('email').focus();
        return;
      }
      var baseUrl = window.location.href.replace(/\/[^/]*$/, '/');
      var { error } = await _supabase.auth.resetPasswordForEmail(email, {
        redirectTo: baseUrl + 'reset-password.html'
      });
      if (error) {
        showToast('오류가 발생했습니다. 잠시 후 다시 시도해주세요');
      } else {
        showToast('재설정 메일을 발송했습니다. 스팸함도 확인해주세요');
      }
    }
  </script>
</body>
</html>
